<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Global HR Vocabulary">

  <title>Global HR Vocabulary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 8px;
      font-size: 32px;
    }

    .top-stats {
      text-align: center;
      font-size: 15px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .top-stats strong {
      color: #222;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .direction {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 22px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /*
     * Wortbereich
     * Der ANZEIGEN-Button steht rechts.
     */
    .word-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .words {
      flex: 1;
      min-width: 0;
    }

    .word-block {
      padding: 15px 0;
    }

    .language {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .word {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
      word-wrap: break-word;
    }

    .connection-line {
      height: 2px;
      width: 100%;
      background: #d0d0d0;
      margin: 3px 0;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      margin: 0 auto;
    }

    .show-button {
      flex: 0 0 145px;
      min-height: 70px;
      border: none;
      border-radius: 15px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .show-button:active {
      transform: scale(0.98);
    }

    .speaker-button {
      border: none;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
    }

    /*
     * Zusatzinformationen
     */
    .word-details {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .word-detail {
      font-size: 13px;
      color: #777;
      line-height: 1.4;
    }

    .word-detail strong {
      color: #555;
      font-weight: 600;
    }

    /*
     * Beispielsatz:
     * volle Breite der Karte, unabhängig
     * vom ANZEIGEN-Button.
     */
    .example-area {
      width: 100%;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    .example-sentence {
      width: 100%;
      font-size: 14px;
      line-height: 1.55;
      color: #555;
      font-style: italic;
      word-wrap: break-word;
    }

    .example-sentence strong {
      color: #444;
      font-style: normal;
      font-weight: 600;
    }

    .answer-hidden {
      visibility: hidden;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .controls button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-button {
      background: #e5e5e7;
      color: #222;
    }

    .input-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .input-toggle {
      width: 100%;
      border: none;
      background: #f0f0f2;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .answer-input-area {
      display: none;
      margin-top: 12px;
    }

    .answer-input-area.visible {
      display: block;
    }

    .answer-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
    }

    .answer-input:focus {
      border-color: #777;
    }

    .check-button {
      background: #e5e5e7;
      color: #222;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .check-result {
      margin-top: 10px;
      font-weight: 600;
      min-height: 22px;
    }

    .add-section {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .add-input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .translation-button,
    .save-button,
    .delete-button,
    .export-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .translation-button {
      background: #e5e5e7;
      color: #222;
    }

    .save-button {
      background: #222;
      color: white;
    }

    .delete-button {
      background: #eee;
      color: #555;
    }

    .export-button {
      background: #e5e5e7;
      color: #222;
    }

    .translation-status {
      min-height: 22px;
      margin: 8px 0;
      font-size: 14px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 650px) {

      body {
        padding: 12px;
      }

      h1 {
        font-size: 27px;
      }

      .card {
        padding: 20px;
      }

      .word-area {
        gap: 10px;
      }

      .show-button {
        flex: 0 0 120px;
        min-height: 65px;
        font-size: 15px;
      }

      .word {
        font-size: 22px;
      }

      .word-detail {
        font-size: 12px;
      }

      .example-sentence {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Global HR Vocabulary</h1>

  <div class="top-stats">

    <div>
      <strong>CSV-Einträge:</strong>
      <span id="csvCount">0</span>
    </div>

    <div>
      <strong>Geübt:</strong>
      <span id="practicedCount">0</span> Wörter
    </div>

  </div>


  <div id="loading" class="loading">
    Vokabeln werden geladen …
  </div>


  <div id="app" style="display:none;">

    <div class="card">

      <div id="direction" class="direction"></div>


      <!-- =========================================
           WORTBEREICH
           ========================================= -->

      <div class="word-area">

        <div class="words">

          <!-- FRAGE -->

          <div class="word-block">

            <div
              id="questionLanguage"
              class="language">
            </div>

            <div>

              <span
                id="questionWord"
                class="word">
              </span>

              <button
                id="speakerButton"
                class="speaker-button"
                onclick="speakEnglish()"
                title="Englisch anhören">
                🔊
              </button>

            </div>

            <div
              id="questionDetails"
              class="word-details">
            </div>

          </div>


          <div class="connection-line"></div>

          <div class="connection-dot"></div>

          <div class="connection-line"></div>


          <!-- ANTWORT -->

          <div class="word-block">

            <div
              id="answerLanguage"
              class="language">
            </div>

            <div
              id="answerWord"
              class="word answer-hidden">
            </div>

            <div
              id="answerDetails"
              class="word-details answer-hidden">
            </div>

          </div>

        </div>


        <button
          id="showButton"
          class="show-button"
          onclick="showAnswerAndNext()">
          ANZEIGEN
        </button>

      </div>


      <!-- =========================================
           BEISPIELSATZ – VOLLE BREITE
           ========================================= -->

      <div
        id="exampleArea"
        class="example-area answer-hidden">

        <div
          id="exampleSentence"
          class="example-sentence">
        </div>

      </div>


      <!-- =========================================
           ANTWORT EINGEBEN
           ========================================= -->

      <div class="input-section">

        <button
          class="input-toggle"
          onclick="toggleAnswerInput()">
          ✍️ ANTWORT EINGEBEN
        </button>


        <div
          id="answerInputArea"
          class="answer-input-area">

          <input
            id="answerInput"
            class="answer-input"
            type="text"
            placeholder="Antwort eingeben …"
            autocomplete="off">


          <button
            class="check-button"
            onclick="checkAnswer()"
            style="width:100%; margin-top:10px;">
            ANTWORT PRÜFEN / ANZEIGEN
          </button>


          <div
            id="checkResult"
            class="check-result">
          </div>

        </div>

      </div>


      <!-- =========================================
           ZURÜCK
           ========================================= -->

      <div class="controls">

        <button
          class="back-button"
          onclick="previousWord()">
          ← ZURÜCK
        </button>

      </div>

    </div>


    <!-- =========================================
         VOKABEL HINZUFÜGEN
         ========================================= -->

    <div class="add-section">

      <div class="section-title">
        + VOKABEL HINZUFÜGEN
      </div>


      <input
        id="newEnglish"
        class="add-input"
        type="text"
        placeholder="Englisch">


      <input
        id="newGerman"
        class="add-input"
        type="text"
        placeholder="Deutsch">


      <button
        class="translation-button"
        onclick="findTranslation()">
        🔍 ÜBERSETZUNG SUCHEN
      </button>


      <div
        id="translationStatus"
        class="translation-status">
      </div>


      <button
        class="save-button"
        onclick="saveVocabulary()">
        VOKABEL SPEICHERN
      </button>

    </div>


    <!-- =========================================
         CSV
         ========================================= -->

    <div class="add-section">

      <div class="section-title">
        VOKABEL-DATEI
      </div>


      <button
        class="export-button"
        onclick="exportCSV()">
        ⬇️ CSV EXPORTIEREN
      </button>


      <button
        class="delete-button"
        onclick="deleteLocalVocabulary()">
        LOKALE VOKABELN LÖSCHEN
      </button>

    </div>

  </div>

</div>


<script>

  let vocabulary = [];

  let csvVocabulary = [];

  let currentIndex = 0;

  let currentDirection = "en-de";


  let practicedWords =
    JSON.parse(
      localStorage.getItem("practicedWords") || "[]"
    );


  let localVocabulary =
    JSON.parse(
      localStorage.getItem("localVocabulary") || "[]"
    );


  function normalize(text) {

    return String(text || "")
      .toLowerCase()
      .trim()
      .replace(/\s+/g, " ");

  }


  /*
   * ============================================
   * CSV PARSER
   * ============================================
   */

  function parseCSV(text) {

    const lines =
      text
        .replace(/^\uFEFF/, "")
        .split(/\r?\n/)
        .filter(
          line => line.trim() !== ""
        );


    if (lines.length === 0) {
      return [];
    }


    const rows =
      lines.map(line => {

        const result = [];

        let current = "";

        let insideQuotes = false;


        for (
          let i = 0;
          i < line.length;
          i++
        ) {

          const char = line[i];


          if (char === '"') {

            if (
              insideQuotes &&
              line[i + 1] === '"'
            ) {

              current += '"';

              i++;

            } else {

              insideQuotes =
                !insideQuotes;

            }

          } else if (
            char === "," &&
            !insideQuotes
          ) {

            result.push(current);

            current = "";

          } else {

            current += char;

          }

        }


        result.push(current);

        return result;

      });


    const header =
      rows[0].map(
        cell => normalize(cell)
      );


    let englishIndex =
      header.indexOf("english");


    let germanIndex =
      header.indexOf("deutsch");


    let constructionIndex =
      header.indexOf(
        "verb + preposition/construction"
      );


    let nounIndex =
      header.indexOf("noun");


    let adjectiveIndex =
      header.indexOf(
        "adjective/participle"
      );


    /*
     * Verschiedene mögliche Namen
     * für die Beispielsatz-Spalte.
     */

    const exampleNames = [

      "example sentence",

      "example sentences",

      "example",

      "examples",

      "beispielsatz",

      "beispielsätze",

      "beispiel",

      "beispiele"

    ];


    let exampleIndex = -1;


    for (
      const name of exampleNames
    ) {

      const index =
        header.indexOf(name);


      if (index !== -1) {

        exampleIndex = index;

        break;

      }

    }


    if (englishIndex === -1) {
      englishIndex = 0;
    }


    if (constructionIndex === -1) {
      constructionIndex = 1;
    }


    if (nounIndex === -1) {
      nounIndex = 2;
    }


    if (adjectiveIndex === -1) {
      adjectiveIndex = 3;
    }


    if (germanIndex === -1) {
      germanIndex = 4;
    }


    const result = [];


    for (
      let i = 1;
      i < rows.length;
      i++
    ) {

      const english =
        (rows[i][englishIndex] || "")
          .trim();


      const construction =
        (rows[i][constructionIndex] || "")
          .trim();


      const noun =
        (rows[i][nounIndex] || "")
          .trim();


      const adjective =
        (rows[i][adjectiveIndex] || "")
          .trim();


      const german =
        (rows[i][germanIndex] || "")
          .trim();


      let example = "";


      if (
        exampleIndex !== -1
      ) {

        example =
          (rows[i][exampleIndex] || "")
            .trim();

      }


      if (english && german) {

        result.push({

          english,

          german,

          construction,

          noun,

          adjective,

          example

        });

      }

    }


    return result;

  }


  /*
   * ============================================
   * CSV LADEN
   * ============================================
   */

  async function loadVocabulary() {

    try {

      const csvUrl =
        new URL(
          "vocabulary.csv",
          window.location.href
        ).href +
        "?v=" +
        Date.now();


      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => controller.abort(),
          10000
        );


      const response =
        await fetch(
          csvUrl,
          {
            cache: "no-store",
            signal: controller.signal
          }
        );


      clearTimeout(timeout);


      if (!response.ok) {

        throw new Error(
          "CSV konnte nicht geladen werden."
        );

      }


      const text =
        await response.text();


      csvVocabulary =
        parseCSV(text);


      document.getElementById(
        "csvCount"
      ).textContent =
        csvVocabulary.length;


      vocabulary =
        mergeVocabulary(
          csvVocabulary,
          localVocabulary
        );


      if (vocabulary.length === 0) {

        throw new Error(
          "Keine Vokabeln gefunden."
        );

      }


      document.getElementById(
        "loading"
      ).style.display = "none";


      document.getElementById(
        "app"
      ).style.display = "block";


      nextWord();

    } catch (error) {

      console.error(error);


      document.getElementById(
        "loading"
      ).innerHTML =
        "Fehler beim Laden der vocabulary.csv.<br><br>" +
        error.message;

    }

  }


  /*
   * ============================================
   * CSV + LOKALE VOKABELN ZUSAMMENFÜHREN
   * ============================================
   */

  function mergeVocabulary(
    csvWords,
    localWords
  ) {

    const combined = [
      ...csvWords,
      ...localWords
    ];


    const seen = new Set();

    const result = [];


    combined.forEach(item => {

      const key =
        normalize(item.english) +
        "||" +
        normalize(item.german);


      if (!seen.has(key)) {

        seen.add(key);

        result.push(item);

      }

    });


    return result;

  }


  /*
   * ============================================
   * NÄCHSTE VOKABEL
   * ============================================
   */

  function nextWord() {

    if (vocabulary.length === 0) {
      return;
    }


    currentIndex =
      Math.floor(
        Math.random() *
        vocabulary.length
      );


    currentDirection =
      Math.random() < 0.5
        ? "en-de"
        : "de-en";


    displayCurrentWord();

  }


  /*
   * ============================================
   * AKTUELLE VOKABEL ANZEIGEN
   * ============================================
   */

  function displayCurrentWord() {

    const item =
      vocabulary[currentIndex];


    const questionWord =
      document.getElementById(
        "questionWord"
      );


    const answerWord =
      document.getElementById(
        "answerWord"
      );


    const questionLanguage =
      document.getElementById(
        "questionLanguage"
      );


    const answerLanguage =
      document.getElementById(
        "answerLanguage"
      );


    const direction =
      document.getElementById(
        "direction"
      );


    const questionDetails =
      document.getElementById(
        "questionDetails"
      );


    const answerDetails =
      document.getElementById(
        "answerDetails"
      );


    const exampleArea =
      document.getElementById(
        "exampleArea"
      );


    const exampleSentence =
      document.getElementById(
        "exampleSentence"
      );


    const showButton =
      document.getElementById(
        "showButton"
      );


    /*
     * Antwort und Beispielsatz
     * wieder verstecken.
     */

    answerWord.classList.add(
      "answer-hidden"
    );


    answerDetails.classList.add(
      "answer-hidden"
    );


    exampleArea.classList.add(
      "answer-hidden"
    );


    showButton.textContent =
      "ANZEIGEN";


    document.getElementById(
      "answerInput"
    ).value = "";


    document.getElementById(
      "checkResult"
    ).textContent = "";


    questionDetails.innerHTML = "";

    answerDetails.innerHTML = "";

    exampleSentence.innerHTML = "";


    /*
     * ENGLISCH → DEUTSCH
     */

    if (
      currentDirection === "en-de"
    ) {

      questionLanguage.textContent =
        "English";


      answerLanguage.textContent =
        "Deutsch";


      questionWord.textContent =
        item.english.toLowerCase();


      answerWord.textContent =
        item.german;


      direction.textContent =
        "English → Deutsch";


      displayDetails(
        questionDetails,
        item
      );

    }


    /*
     * DEUTSCH → ENGLISCH
     */

    else {

      questionLanguage.textContent =
        "Deutsch";


      answerLanguage.textContent =
        "English";


      questionWord.textContent =
        item.german.toLowerCase();


      answerWord.textContent =
        item.english;


      direction.textContent =
        "Deutsch → English";


      displayDetails(
        answerDetails,
        item
      );

    }


    /*
     * Beispielsatz vorbereiten.
     * Noch nicht sichtbar.
     */

    if (item.example) {

      exampleSentence.innerHTML =
        "<strong>Beispielsatz:</strong> " +
        escapeHtml(item.example);

    }

  }


  /*
   * ============================================
   * DETAILS DER ENGLISCHEN VOKABEL
   * ============================================
   */

  function displayDetails(
    container,
    item
  ) {

    container.innerHTML = "";


    if (item.construction) {

      const div =
        document.createElement("div");

      div.className =
        "word-detail";

      div.innerHTML =
        "<strong>Verb + Konstruktion:</strong> " +
        escapeHtml(
          item.construction
        );

      container.appendChild(div);

    }


    if (item.noun) {

      const div =
        document.createElement("div");

      div.className =
        "word-detail";

      div.innerHTML =
        "<strong>Nomen:</strong> " +
        escapeHtml(
          item.noun
        );

      container.appendChild(div);

    }


    if (item.adjective) {

      const div =
        document.createElement("div");

      div.className =
        "word-detail";

      div.innerHTML =
        "<strong>Adjektiv/Partizip:</strong> " +
        escapeHtml(
          item.adjective
        );

      container.appendChild(div);

    }

  }


  /*
   * ============================================
   * HTML SICHER AUSGEBEN
   * ============================================
   */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text || "";

    return div.innerHTML;

  }


  /*
   * ============================================
   * ENGLISCH AUSSPRECHEN
   * ============================================
   */

  function speakEnglish() {

    if (
      !window.speechSynthesis ||
      vocabulary.length === 0
    ) {

      return;

    }


    const englishText =
      vocabulary[currentIndex].english;


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        englishText
      );


    utterance.lang =
      "en-US";


    utterance.rate =
      0.9;


    utterance.pitch =
      1;


    const voices =
      window.speechSynthesis.getVoices();


    const englishVoice =
      voices.find(
        voice =>
          voice.lang &&
          voice.lang.toLowerCase() ===
            "en-us"
      ) ||
      voices.find(
        voice =>
          voice.lang &&
          voice.lang
            .toLowerCase()
            .startsWith("en")
      );


    if (englishVoice) {

      utterance.voice =
        englishVoice;

    }


    window.speechSynthesis.speak(
      utterance
    );

  }


  /*
   * ============================================
   * ANTWORT ANZEIGEN / WEITER
   * ============================================
   */

  function showAnswerAndNext() {

    const answerWord =
      document.getElementById(
        "answerWord"
      );


    const answerDetails =
      document.getElementById(
        "answerDetails"
      );


    const exampleArea =
      document.getElementById(
        "exampleArea"
      );


    const showButton =
      document.getElementById(
        "showButton"
      );


    if (
      answerWord.classList.contains(
        "answer-hidden"
      )
    ) {

      answerWord.classList.remove(
        "answer-hidden"
      );


      answerDetails.classList.remove(
        "answer-hidden"
      );


      exampleArea.classList.remove(
        "answer-hidden"
      );


      showButton.textContent =
        "WEITER →";


      markAsPracticed();

    }


    else {

      nextWord();

    }

  }


  /*
   * ============================================
   * ZURÜCK
   * ============================================
   */

  function previousWord() {

    if (vocabulary.length === 0) {
      return;
    }


    currentIndex =
      (
        currentIndex -
        1 +
        vocabulary.length
      ) %
      vocabulary.length;


    currentDirection =
      Math.random() < 0.5
        ? "en-de"
        : "de-en";


    displayCurrentWord();

  }


  /*
   * ============================================
   * GEÜBT MARKIEREN
   * ============================================
   */

  function markAsPracticed() {

    const item =
      vocabulary[currentIndex];


    const key =
      normalize(item.english) +
      "||" +
      normalize(item.german);


    if (
      !practicedWords.includes(key)
    ) {

      practicedWords.push(key);


      localStorage.setItem(
        "practicedWords",
        JSON.stringify(
          practicedWords
        )
      );

    }


    updateStats();

  }


  function updateStats() {

    document.getElementById(
      "practicedCount"
    ).textContent =
      practicedWords.length;

  }


  /*
   * ============================================
   * ANTWORT PRÜFEN
   * ============================================
   */

  function isAnswerCorrect(
    userAnswer,
    correctAnswer
  ) {

    const normalizedUser =
      normalize(userAnswer);


    const possibleAnswers =
      String(correctAnswer)
        .split("/")
        .map(
          answer =>
            normalize(answer)
        )
        .filter(Boolean);


    return possibleAnswers.includes(
      normalizedUser
    );

  }


  function checkAnswer() {

    const input =
      document.getElementById(
        "answerInput"
      );


    const result =
      document.getElementById(
        "checkResult"
      );


    const answerWord =
      document.getElementById(
        "answerWord"
      );


    const answerDetails =
      document.getElementById(
        "answerDetails"
      );


    const exampleArea =
      document.getElementById(
        "exampleArea"
      );


    const userAnswer =
      input.value.trim();


    /*
     * Keine Eingabe:
     * einfach Antwort anzeigen.
     */

    if (!userAnswer) {

      answerWord.classList.remove(
        "answer-hidden"
      );


      answerDetails.classList.remove(
        "answer-hidden"
      );


      exampleArea.classList.remove(
        "answer-hidden"
      );


      result.textContent =
        "";


      markAsPracticed();


      document.getElementById(
        "showButton"
      ).textContent =
        "WEITER →";


      return;

    }


    const correctAnswer =
      currentDirection === "en-de"
        ? vocabulary[currentIndex].german
        : vocabulary[currentIndex].english;


    /*
     * RICHTIG
     */

    if (
      isAnswerCorrect(
        userAnswer,
        correctAnswer
      )
    ) {

      result.textContent =
        "✓ Richtig";


      answerWord.classList.remove(
        "answer-hidden"
      );


      answerDetails.classList.remove(
        "answer-hidden"
      );


      exampleArea.classList.remove(
        "answer-hidden"
      );


      document.getElementById(
        "showButton"
      ).textContent =
        "WEITER →";


      markAsPracticed();

    }


    /*
     * FALSCH
     */

    else {

      result.textContent =
        "✗ Nicht ganz – richtige Antwort:";


      answerWord.classList.remove(
        "answer-hidden"
      );


      answerDetails.classList.remove(
        "answer-hidden"
      );


      exampleArea.classList.remove(
        "answer-hidden"
      );


      document.getElementById(
        "showButton"
      ).textContent =
        "WEITER →";


      markAsPracticed();

    }

  }


  /*
   * ============================================
   * EINGABEFELD EIN-/AUSBLENDEN
   * ============================================
   */

  function toggleAnswerInput() {

    const area =
      document.getElementById(
        "answerInputArea"
      );


    area.classList.toggle(
      "visible"
    );

  }


  /*
   * ============================================
   * ÜBERSETZUNGSFELDER
   * ============================================
   */

  function setupTranslationInputs() {

    const englishInput =
      document.getElementById(
        "newEnglish"
      );


    const germanInput =
      document.getElementById(
        "newGerman"
      );


    englishInput.addEventListener(
      "input",
      () => {

        if (
          englishInput.value.trim()
        ) {

          germanInput.value = "";

        }


        document.getElementById(
          "translationStatus"
        ).textContent = "";

      }
    );


    germanInput.addEventListener(
      "input",
      () => {

        if (
          germanInput.value.trim()
        ) {

          englishInput.value = "";

        }


        document.getElementById(
          "translationStatus"
        ).textContent = "";

      }
    );

  }


  /*
   * ============================================
   * ÜBERSETZUNG SUCHEN
   * ============================================
   */

  async function findTranslation() {

    const englishInput =
      document.getElementById(
        "newEnglish"
      );


    const germanInput =
      document.getElementById(
        "newGerman"
      );


    const status =
      document.getElementById(
        "translationStatus"
      );


    const english =
      englishInput.value.trim();


    const german =
      germanInput.value.trim();


    if (
      english &&
      german
    ) {

      status.textContent =
        "Bitte nur Englisch oder Deutsch eingeben.";

      return;

    }


    if (
      !english &&
      !german
    ) {

      status.textContent =
        "Bitte Englisch oder Deutsch eingeben.";

      return;

    }


    status.textContent =
      "Übersetzung wird gesucht …";


    try {

      let query;

      let langPair;


      if (english) {

        query = english;

        langPair = "en|de";

      } else {

        query = german;

        langPair = "de|en";

      }


      const url =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(query) +
        "&langpair=" +
        langPair;


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (
        !data ||
        !data.responseData ||
        !data.responseData.translatedText
      ) {

        throw new Error(
          "Keine Übersetzung gefunden."
        );

      }


      const translation =
        data.responseData
          .translatedText
          .trim();


      if (english) {

        germanInput.value =
          translation;

      } else {

        englishInput.value =
          translation;

      }


      status.textContent =
        "Übersetzung gefunden.";

    } catch (error) {

      console.error(error);


      status.textContent =
        "Übersetzung konnte nicht gefunden werden.";

    }

  }


  /*
   * ============================================
   * NEUE VOKABEL SPEICHERN
   * ============================================
   */

  function saveVocabulary() {

    const englishInput =
      document.getElementById(
        "newEnglish"
      );


    const germanInput =
      document.getElementById(
        "newGerman"
      );


    const status =
      document.getElementById(
        "translationStatus"
      );


    const english =
      englishInput.value.trim();


    const german =
      germanInput.value.trim();


    if (
      !english ||
      !german
    ) {

      status.textContent =
        "Bitte Englisch und Deutsch ausfüllen.";

      return;

    }


    const duplicate =
      vocabulary.some(
        item =>
          normalize(item.english) ===
            normalize(english) &&
          normalize(item.german) ===
            normalize(german)
      );


    if (duplicate) {

      status.textContent =
        "Diese Vokabel ist bereits vorhanden.";

      return;

    }


    const newWord = {

      english,

      german,

      construction: "",

      noun: "",

      adjective: "",

      example: ""

    };


    localVocabulary.push(
      newWord
    );


    localStorage.setItem(
      "localVocabulary",
      JSON.stringify(
        localVocabulary
      )
    );


    vocabulary =
      mergeVocabulary(
        csvVocabulary,
        localVocabulary
      );


    englishInput.value = "";

    germanInput.value = "";


    status.textContent =
      "Vokabel wurde gespeichert.";

  }


  /*
   * ============================================
   * LOKALE VOKABELN LÖSCHEN
   * ============================================
   */

  function deleteLocalVocabulary() {

    const confirmed =
      confirm(
        "Möchtest du wirklich alle lokal hinzugefügten Vokabeln löschen?"
      );


    if (!confirmed) {
      return;
    }


    localVocabulary = [];


    localStorage.removeItem(
      "localVocabulary"
    );


    vocabulary =
      mergeVocabulary(
        csvVocabulary,
        localVocabulary
      );


    alert(
      "Lokale Vokabeln wurden gelöscht."
    );

  }


  /*
   * ============================================
   * CSV EXPORT
   * ============================================
   */

  function csvEscape(value) {

    const text =
      String(value ?? "");


    if (
      text.includes(",") ||
      text.includes('"') ||
      text.includes("\n") ||
      text.includes("\r")
    ) {

      return '"' +
        text.replace(
          /"/g,
          '""'
        ) +
        '"';

    }


    return text;

  }


  function exportCSV() {

    const header = [

      "English",

      "Verb + preposition/construction",

      "Noun",

      "Adjective/Participle",

      "Deutsch",

      "Example sentence"

    ];


    const rows = [
      header
    ];


    vocabulary.forEach(
      item => {

        rows.push([

          item.english,

          item.construction || "",

          item.noun || "",

          item.adjective || "",

          item.german,

          item.example || ""

        ]);

      }
    );


    const csv =
      rows
        .map(
          row =>
            row
              .map(csvEscape)
              .join(",")
        )
        .join("\r\n");


    const blob =
      new Blob(
        [
          "\uFEFF" + csv
        ],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      "vocabulary.csv";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    URL.revokeObjectURL(
      url
    );

  }


  /*
   * ============================================
   * START
   * ============================================
   */

  function start() {

    updateStats();

    setupTranslationInputs();

    loadVocabulary();

  }


  start();

</script>
