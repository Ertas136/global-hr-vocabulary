<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Global HR English</title>

<style>

/* =========================================
   GRUNDLAYOUT
========================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  color: #222;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}


/* =========================================
   VOKABELKARTE
========================================= */

.card {
  background: white;
  border-radius: 18px;
  padding: 30px 25px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  text-align: center;
}

.direction {
  font-size: 14px;
  color: #777;
  margin-bottom: 18px;
}

.question {
  font-size: 28px;
  font-weight: bold;
  margin: 25px 0;
  line-height: 1.3;
}

.answer {
  font-size: 23px;
  color: #333;
  margin: 20px 0;
  line-height: 1.4;
}


/* =========================================
   EINGABE
========================================= */

.input-area {
  margin-top: 20px;
}

.answer-input {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 10px;
  outline: none;
}

.answer-input:focus {
  border-color: #555;
}


/* =========================================
   BUTTONS
========================================= */

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: default;
}

.show-button {
  background: #222;
  color: white;
}

.next-button {
  background: #e9eaed;
  color: #222;
}

.optional-button {
  background: #f0f0f0;
  color: #333;
}


/* =========================================
   NAVIGATION
========================================= */

.navigation {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.navigation button {
  flex: 1;
  font-size: 15px;
  background: white;
  border: 1px solid #ddd;
}


/* =========================================
   STATISTIK
========================================= */

.stats {
  text-align: center;
  margin-top: 20px;
  font-size: 16px;
  color: #555;
}


/* =========================================
   BEREICHE
========================================= */

.section {
  background: white;
  margin-top: 20px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.section h2 {
  font-size: 19px;
  margin-top: 0;
}


/* =========================================
   FORMULAR
========================================= */

input[type="text"] {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

input[type="text"]:focus {
  outline: none;
  border-color: #555;
}

.field-label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
  font-size: 14px;
}

.add-button {
  background: #222;
  color: white;
}

.translate-button {
  background: #e9eaed;
  color: #222;
}

.export-button {
  background: #222;
  color: white;
}

.delete-button {
  background: #eee;
  color: #333;
}


/* =========================================
   ERGEBNIS
========================================= */

.result {
  margin-top: 15px;
  font-size: 17px;
  font-weight: bold;
}

.correct {
  color: #16803c;
}

.incorrect {
  color: #b42318;
}


/* =========================================
   ÜBERSETZUNGSSTATUS
========================================= */

.translation-status {
  min-height: 20px;
  margin-top: 5px;
  font-size: 14px;
  color: #777;
}


/* =========================================
   STATUS
========================================= */

.status {
  text-align: center;
  margin-top: 15px;
  color: #777;
  font-size: 14px;
}


/* =========================================
   HIDDEN
========================================= */

.hidden {
  display: none;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 500px) {

  body {
    padding: 12px;
  }

  .card {
    padding: 25px 18px;
  }

  .question {
    font-size: 25px;
  }

  .answer {
    font-size: 21px;
  }

}

</style>

</head>


<body>


<div class="container">


<h1>Global HR English</h1>


<!-- =====================================
     VOKABELKARTE
====================================== -->

<div class="card">


  <div
    id="direction"
    class="direction"
  >
    Deutsch → Englisch
  </div>


  <div
    id="question"
    class="question"
  >
    Lade Vokabeln ...
  </div>


  <!-- OPTIONALE EINGABE -->

  <div
    id="inputArea"
    class="input-area hidden"
  >

    <input
      id="answerInput"
      class="answer-input"
      type="text"
      placeholder="Deine Antwort ..."
      autocomplete="off"
    >


    <button
      class="show-button"
      onclick="showAnswer()"
    >
      ANTWORT PRÜFEN / ANZEIGEN
    </button>

  </div>


  <!-- ANTWORT -->

  <div
    id="answer"
    class="answer hidden"
  ></div>


  <!-- ERGEBNIS -->

  <div
    id="result"
    class="result"
  ></div>


  <!-- ANZEIGEN -->

  <button
    id="showButton"
    class="show-button"
    onclick="showAnswer()"
  >
    ANZEIGEN
  </button>


  <!-- EINGABE -->

  <button
    id="inputButton"
    class="optional-button"
    onclick="enableInput()"
  >
    ✍️ ANTWORT EINGEBEN
  </button>


  <!-- NÄCHSTE -->

  <button
    id="nextButton"
    class="next-button"
    onclick="nextQuestion()"
  >
    NÄCHSTE VOKABEL
  </button>


  <!-- NAVIGATION -->

  <div class="navigation">

    <button
      id="backButton"
      onclick="goBack()"
    >
      ← ZURÜCK
    </button>


    <button
      id="forwardButton"
      onclick="goForward()"
    >
      WEITER →
    </button>

  </div>

</div>


<!-- =====================================
     STATISTIK
====================================== -->

<div
  id="practicedCount"
  class="stats"
>
  Geübt: 0 Wörter
</div>


<!-- =====================================
     VOKABEL HINZUFÜGEN
====================================== -->

<div class="section">

  <h2>+ VOKABEL HINZUFÜGEN</h2>


  <label
    class="field-label"
    for="englishInput"
  >
    English
  </label>


  <input
    id="englishInput"
    type="text"
    placeholder="z. B. to address concerns"
  >


  <label
    class="field-label"
    for="germanInput"
  >
    Deutsch
  </label>


  <input
    id="germanInput"
    type="text"
    placeholder="z. B. Bedenken ansprechen"
  >


  <!-- ÜBERSETZUNG SUCHEN -->

  <button
    class="translate-button"
    onclick="translateVocabulary()"
  >
    🔍 ÜBERSETZUNG SUCHEN
  </button>


  <div
    id="translationStatus"
    class="translation-status"
  ></div>


  <!-- SPEICHERN -->

  <button
    class="add-button"
    onclick="addVocabulary()"
  >
    VOKABEL SPEICHERN
  </button>

</div>


<!-- =====================================
     CSV
====================================== -->

<div class="section">

  <h2>CSV EXPORT</h2>


  <button
    class="export-button"
    onclick="exportCSV()"
  >
    AKTUELLE CSV EXPORTIEREN
  </button>


  <button
    class="delete-button"
    onclick="deleteLocalVocabulary()"
  >
    LOKALE VOKABELN LÖSCHEN
  </button>

</div>


<!-- STATUS -->

<div
  id="status"
  class="status"
>
  Lade Vokabeln ...
</div>


</div>


<script>


/* =========================================
   VARIABLEN
========================================= */

let vocabulary = [];

let currentWord = null;

let direction = null;

let history = [];

let historyPosition = -1;


/* =========================================
   GEÜBTE VOKABELN
========================================= */

let practicedWords =
  JSON.parse(
    localStorage.getItem(
      "practicedWords"
    )
  ) || [];


/* =========================================
   LOKALE VOKABELN
========================================= */

let localVocabulary =
  JSON.parse(
    localStorage.getItem(
      "localVocabulary"
    )
  ) || [];


/* =========================================
   CSV LADEN
========================================= */

async function loadVocabulary() {

  try {

    const response =
      await fetch(
        "vocabulary.csv?t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "CSV konnte nicht geladen werden."
      );

    }


    const text =
      await response.text();


    const githubVocabulary =
      parseCSV(text);


    vocabulary =
      deduplicateVocabulary(
        githubVocabulary.concat(
          localVocabulary
        )
      );


    updateStatus(
      vocabulary.length +
      " Vokabeln geladen."
    );


    updatePracticedCount();


    nextQuestion();

  }

  catch (error) {

    console.error(error);


    updateStatus(
      "Fehler beim Laden der vocabulary.csv."
    );

  }

}


/* =========================================
   DUPLIKATE ENTFERNEN
========================================= */

function deduplicateVocabulary(words) {

  const seen =
    new Set();

  const result = [];


  words.forEach(
    word => {

      const key =
        word.english
          .trim()
          .toLowerCase() +
        "|" +
        word.german
          .trim()
          .toLowerCase();


      if (!seen.has(key)) {

        seen.add(key);

        result.push(word);

      }

    }
  );


  return result;

}


/* =========================================
   CSV PARSEN
========================================= */

function parseCSV(text) {

  const lines =
    text
      .trim()
      .split(/\r?\n/);


  const result = [];


  for (
    let i = 1;
    i < lines.length;
    i++
  ) {

    const line =
      lines[i].trim();


    if (!line) {
      continue;
    }


    const match =
      line.match(
        /^"((?:""|[^"])*)","((?:""|[^"])*)"$/
      );


    if (match) {

      const english =
        match[1]
          .replace(
            /""/g,
            '"'
          );


      const german =
        match[2]
          .replace(
            /""/g,
            '"'
          );


      result.push({

        english:
          english,

        german:
          german

      });

    }

  }


  return result;

}


/* =========================================
   NÄCHSTE VOKABEL
========================================= */

function nextQuestion() {

  if (
    vocabulary.length === 0
  ) {

    return;

  }


  const randomIndex =
    Math.floor(
      Math.random() *
      vocabulary.length
    );


  currentWord =
    vocabulary[randomIndex];


  direction =
    Math.random() < 0.5
      ? "de-en"
      : "en-de";


  history =
    history.slice(
      0,
      historyPosition + 1
    );


  history.push({

    word:
      currentWord,

    direction:
      direction

  });


  historyPosition =
    history.length - 1;


  displayCurrentQuestion();

}


/* =========================================
   FRAGE ANZEIGEN
========================================= */

function displayCurrentQuestion() {

  if (!currentWord) {
    return;
  }


  const questionElement =
    document.getElementById(
      "question"
    );


  const directionElement =
    document.getElementById(
      "direction"
    );


  const answerElement =
    document.getElementById(
      "answer"
    );


  const resultElement =
    document.getElementById(
      "result"
    );


  const inputArea =
    document.getElementById(
      "inputArea"
    );


  const answerInput =
    document.getElementById(
      "answerInput"
    );


  questionElement.textContent =
    direction === "de-en"
      ? currentWord.german
      : currentWord.english;


  directionElement.textContent =
    direction === "de-en"
      ? "Deutsch → Englisch"
      : "Englisch → Deutsch";


  answerElement.textContent =
    "";


  answerElement.classList.add(
    "hidden"
  );


  resultElement.textContent =
    "";


  resultElement.className =
    "result";


  inputArea.classList.add(
    "hidden"
  );


  answerInput.value =
    "";


  document
    .getElementById(
      "showButton"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "inputButton"
    )
    .classList.remove(
      "hidden"
    );


  updateNavigation();

}


/* =========================================
   EINGABE AKTIVIEREN
========================================= */

function enableInput() {

  const inputArea =
    document.getElementById(
      "inputArea"
    );


  const inputButton =
    document.getElementById(
      "inputButton"
    );


  const showButton =
    document.getElementById(
      "showButton"
    );


  inputArea.classList.remove(
    "hidden"
  );


  inputButton.classList.add(
    "hidden"
  );


  showButton.classList.add(
    "hidden"
  );


  document
    .getElementById(
      "answerInput"
    )
    .focus();

}


/* =========================================
   ANTWORT ANZEIGEN / PRÜFEN
========================================= */

function showAnswer() {

  if (!currentWord) {
    return;
  }


  const answer =
    direction === "de-en"
      ? currentWord.english
      : currentWord.german;


  const answerElement =
    document.getElementById(
      "answer"
    );


  answerElement.textContent =
    answer;


  answerElement.classList.remove(
    "hidden"
  );


  const input =
    document
      .getElementById(
        "answerInput"
      )
      .value
      .trim();


  const resultElement =
    document.getElementById(
      "result"
    );


  if (input !== "") {

    const isCorrect =
      isAnswerCorrect(
        input,
        answer
      );


    if (isCorrect) {

      resultElement.textContent =
        "✓ Richtig";


      resultElement.className =
        "result correct";

    }

    else {

      resultElement.textContent =
        "Nicht ganz";


      resultElement.className =
        "result incorrect";

    }

  }


  const wordKey =
    currentWord.english +
    "|" +
    currentWord.german;


  if (
    !practicedWords.includes(
      wordKey
    )
  ) {

    practicedWords.push(
      wordKey
    );


    localStorage.setItem(
      "practicedWords",
      JSON.stringify(
        practicedWords
      )
    );

  }


  updatePracticedCount();

}


/* =========================================
   MEHRERE ANTWORTEN PRÜFEN
========================================= */

function isAnswerCorrect(
  userAnswer,
  correctAnswer
) {

  /*
     Mehrere akzeptierte Antworten
     können durch "/" getrennt werden.

     Beispiel:

     machbar / umsetzbar / realisierbar
  */

  const acceptedAnswers =
    correctAnswer
      .split("/")
      .map(
        answer =>
          normalizeAnswer(answer)
      )
      .filter(
        answer =>
          answer !== ""
      );


  const normalizedUserAnswer =
    normalizeAnswer(
      userAnswer
    );


  return acceptedAnswers.includes(
    normalizedUserAnswer
  );

}


/* =========================================
   ANTWORT NORMALISIEREN
========================================= */

function normalizeAnswer(text) {

  return text
    .toLowerCase()
    .trim()
    .replace(
      /\s+/g,
      " "
    )
    .replace(
      /[.!?]+$/g,
      ""
    );

}


/* =========================================
   ZURÜCK
========================================= */

function goBack() {

  if (
    historyPosition <= 0
  ) {

    return;

  }


  historyPosition--;


  const item =
    history[
      historyPosition
    ];


  currentWord =
    item.word;


  direction =
    item.direction;


  displayCurrentQuestion();

}


/* =========================================
   WEITER
========================================= */

function goForward() {

  if (
    historyPosition <
    history.length - 1
  ) {

    historyPosition++;


    const item =
      history[
        historyPosition
      ];


    currentWord =
      item.word;


    direction =
      item.direction;


    displayCurrentQuestion();


    return;

  }


  nextQuestion();

}


/* =========================================
   NAVIGATION
========================================= */

function updateNavigation() {

  document
    .getElementById(
      "backButton"
    )
    .disabled =
      historyPosition <= 0;


  document
    .getElementById(
      "forwardButton"
    )
    .disabled =
      false;

}


/* =========================================
   GEÜBT-ZÄHLER
========================================= */

function updatePracticedCount() {

  document
    .getElementById(
      "practicedCount"
    )
    .textContent =
      "Geübt: " +
      practicedWords.length +
      " Wörter";

}


/* =========================================
   AUTOMATISCHE ÜBERSETZUNG
========================================= */

async function translateVocabulary() {

  const englishInput =
    document.getElementById(
      "englishInput"
    );


  const germanInput =
    document.getElementById(
      "germanInput"
    );


  const status =
    document.getElementById(
      "translationStatus"
    );


  const english =
    englishInput.value.trim();


  const german =
    germanInput.value.trim();


  /*
     Beide Felder leer
  */

  if (
    english === "" &&
    german === ""
  ) {

    status.textContent =
      "Bitte zuerst Englisch oder Deutsch eingeben.";

    return;

  }


  /*
     Beide Felder ausgefüllt

     Nichts überschreiben.
  */

  if (
    english !== "" &&
    german !== ""
  ) {

    status.textContent =
      "Beide Felder sind bereits ausgefüllt.";

    return;

  }


  /*
     Übersetzung läuft
  */

  status.textContent =
    "Übersetzung wird gesucht ...";


  try {

    let sourceText;

    let sourceLanguage;

    let targetLanguage;


    /*
       Englisch → Deutsch
    */

    if (english !== "") {

      sourceText =
        english;

      sourceLanguage =
        "en";

      targetLanguage =
        "de";

    }


    /*
       Deutsch → Englisch
    */

    else {

      sourceText =
        german;

      sourceLanguage =
        "de";

      targetLanguage =
        "en";

    }


    /*
       URL für Übersetzungsdienst
    */

    const url =
      "https://api.mymemory.translated.net/get" +
      "?q=" +
      encodeURIComponent(
        sourceText
      ) +
      "&langpair=" +
      sourceLanguage +
      "|" +
      targetLanguage;


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Übersetzungsdienst nicht erreichbar."
      );

    }


    const data =
      await response.json();


    /*
       Übersetzung auslesen
    */

    if (
      !data.responseData ||
      !data.responseData.translatedText
    ) {

      throw new Error(
        "Keine Übersetzung gefunden."
      );

    }


    const translated =
      decodeHTMLEntities(
        data.responseData.translatedText
      );


    /*
       Ergebnis eintragen
    */

    if (sourceLanguage === "en") {

      germanInput.value =
        translated;

    }

    else {

      englishInput.value =
        translated;

    }


    status.textContent =
      "Übersetzung gefunden – bitte prüfen und ggf. anpassen.";

  }

  catch (error) {

    console.error(error);


    status.textContent =
      "Übersetzung konnte nicht geladen werden.";

  }

}


/* =========================================
   HTML-ZEICHEN DEKODIEREN
========================================= */

function decodeHTMLEntities(text) {

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.innerHTML =
    text;


  return textarea.value;

}


/* =========================================
   VOKABEL HINZUFÜGEN
========================================= */

function addVocabulary() {

  const english =
    document
      .getElementById(
        "englishInput"
      )
      .value
      .trim();


  const german =
    document
      .getElementById(
        "germanInput"
      )
      .value
      .trim();


  if (
    english === "" ||
    german === ""
  ) {

    alert(
      "Bitte Englisch und Deutsch eingeben."
    );

    return;

  }


  const exists =
    vocabulary.some(
      word =>

        word.english
          .toLowerCase()
          .trim() ===
        english
          .toLowerCase()
          .trim()

        &&

        word.german
          .toLowerCase()
          .trim() ===
        german
          .toLowerCase()
          .trim()
    );


  if (exists) {

    alert(
      "Diese Vokabel ist bereits vorhanden."
    );

    return;

  }


  const newWord = {

    english:
      english,

    german:
      german

  };


  localVocabulary.push(
    newWord
  );


  localStorage.setItem(
    "localVocabulary",
    JSON.stringify(
      localVocabulary
    )
  );


  vocabulary.push(
    newWord
  );


  document
    .getElementById(
      "englishInput"
    )
    .value = "";


  document
    .getElementById(
      "germanInput"
    )
    .value = "";


  document
    .getElementById(
      "translationStatus"
    )
    .textContent = "";


  updateStatus(
    "Vokabel hinzugefügt."
  );


  alert(
    "Vokabel wurde hinzugefügt."
  );

}


/* =========================================
   CSV EXPORT
========================================= */

function exportCSV() {

  if (
    vocabulary.length === 0
  ) {

    alert(
      "Keine Vokabeln zum Exportieren vorhanden."
    );

    return;

  }


  let csv =
    "English,German\n";


  vocabulary.forEach(
    word => {

      const english =
        csvEscape(
          word.english
        );


      const german =
        csvEscape(
          word.german
        );


      csv +=
        english +
        "," +
        german +
        "\n";

    }
  );


  /*
     UTF-8 BOM für Excel
  */

  const blob =
    new Blob(
      [
        "\uFEFF" +
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "vocabulary.csv";


  document
    .body
    .appendChild(
      link
    );


  link.click();


  document
    .body
    .removeChild(
      link
    );


  URL.revokeObjectURL(
    url
  );


  alert(
    vocabulary.length +
    " Vokabeln wurden als vocabulary.csv exportiert."
  );

}


/* =========================================
   CSV ESCAPE
========================================= */

function csvEscape(value) {

  const escaped =
    value.replace(
      /"/g,
      '""'
    );


  return (
    '"' +
    escaped +
    '"'
  );

}


/* =========================================
   LOKALE VOKABELN LÖSCHEN
========================================= */

function deleteLocalVocabulary() {

  if (
    localVocabulary.length === 0
  ) {

    alert(
      "Es sind keine lokal hinzugefügten Vokabeln vorhanden."
    );

    return;

  }


  const confirmed =
    confirm(
      "Möchtest du wirklich alle lokal hinzugefügten Vokabeln löschen?"
    );


  if (!confirmed) {

    return;

  }


  localStorage.removeItem(
    "localVocabulary"
  );


  alert(
    "Lokale Vokabeln wurden gelöscht."
  );


  location.reload();

}


/* =========================================
   STATUS
========================================= */

function updateStatus(
  message
) {

  document
    .getElementById(
      "status"
    )
    .textContent =
      message;

}


/* =========================================
   ENTER-TASTE BEI ANTWORT
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      const input =
        document.getElementById(
          "answerInput"
        );


      if (
        document.activeElement ===
        input
      ) {

        showAnswer();

      }

    }

  }
);


/* =========================================
   START
========================================= */

loadVocabulary();

</script>
