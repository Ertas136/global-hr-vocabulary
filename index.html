    }

    .top-stats span {
      display: block;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    #app {
      display: none;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .connection {

      align-items: center;
      gap: 18px;
    }

    .words {

    .word {

    .add-section button {
      margin-top: 5px;

      border-bottom: 1px solid #eee;

    .own-word-text {
      min-width: 0;
      flex: 1;

    .own-word-english {
      font-weight: 600;
    }

    .own-word-german {
      color: #777;
      font-size: 13px;

    .delete-word-button {

      font-size: 12px;
      flex-shrink: 0;

    .delete-word-button:hover {
      background: #ddd;
    }

    .no-own-vocabulary {
      color: #999;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 650px) {

      body {
        padding: 12px;

        font-size: 26px;

      }

      .word {
        font-size: 22px;
      }

      .word-detail {
        font-size: 11px;
      }

      .language {
        font-size: 11px;
      }
    }
  </style>
</head>
