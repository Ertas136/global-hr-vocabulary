<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Global HR Vocabulary">

  <title>Global HR Vocabulary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 8px;
      font-size: 32px;
    }

    .top-stats {
      text-align: center;
      font-size: 15px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .top-stats strong {
      color: #222;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .direction {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 22px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .words {
      flex: 1;
      min-width: 0;
    }

    .word-block {
      padding: 15px 0;
    }

    .language {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .word {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      word-wrap: break-word;
    }

    .answer-hidden {
      visibility: hidden;
    }

    .connection-line {
      height: 2px;
      width: 100%;
      background: #d0d0d0;
      margin: 3px 0;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      margin: 0 auto;
    }

    .show-button {
      flex: 0 0 145px;
      min-height: 70px;
      border: none;
      border-radius: 15px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .show-button:active {
      transform: scale(0.98);
    }

    .speaker-button {
      border: none;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .controls button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-button {
      background: #e5e5e7;
      color: #222;
    }

    .check-button {
      background: #e5e5e7;
      color: #222;
    }

    .input-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .input-toggle {
      width: 100%;
      border: none;
      background: #f0f0f2;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .answer-input-area {
      display: none;
      margin-top: 12px;
    }

    .answer-input-area.visible {
      display: block;
    }

    .answer-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
    }

    .answer-input:focus {
      border-color: #777;
    }

    .check-result {
      margin-top: 10px;
      font-weight: 600;
      min-height: 22px;
    }

    .add-section {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .add-input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .translation-button,
    .save-button,
    .delete-button,
    .export-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .translation-button {
      background: #e5e5e7;
      color: #222;
    }

    .save-button {
      background: #222;
      color: white;
    }

    .delete-button {
      background: #eee;
      color: #555;
    }

    .export-button {
      background: #e5e5e7;
      color: #222;
    }

    .translation-status {
      min-height: 22px;
      margin: 8px 0;
      font-size: 14px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 27px;
      }

      .card {
        padding: 20px;
      }

      .connection {
        gap: 10px;
      }

      .show-button {
        flex: 0 0 120px;
        min-height: 65px;
        font-size: 15px;
      }

      .word {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Global HR Vocabulary</h1>

  <!-- Statistik ganz oben -->
  <div class="top-stats">
    <div>
      <strong>CSV-Einträge:</strong>
      <span id="csvCount">0</span>
    </div>

    <div>
      <strong>Geübt:</strong>
      <span id="practicedCount">0</span> Wörter
    </div>
  </div>

  <div id="loading" class="loading">
    Vokabeln werden geladen …
  </div>

  <div id="app" style="display:none;">

    <div class="card">

      <div id="direction" class="direction"></div>

      <div class="connection">

        <div class="words">

          <div class="word-block">
            <div id="questionLanguage" class="language"></div>

            <div>
              <span id="questionWord" class="word"></span>

              <button
                id="speakerButton"
                class="speaker-button"
                onclick="speakEnglish()"
                title="Englisch anhören">
                🔊
              </button>
            </div>
          </div>

          <div class="connection-line"></div>
          <div class="connection-dot"></div>
          <div class="connection-line"></div>

          <div class="word-block">
            <div id="answerLanguage" class="language"></div>

            <div id="answerWord" class="word answer-hidden"></div>
          </div>

        </div>

        <button
          id="showButton"
          class="show-button"
          onclick="showAnswerAndNext()">
          ANZEIGEN
        </button>

      </div>

      <div class="input-section">

        <button
          class="input-toggle"
          onclick="toggleAnswerInput()">
          ✍️ ANTWORT EINGEBEN
        </button>

        <div id="answerInputArea" class="answer-input-area">

          <input
            id="answerInput"
            class="answer-input"
            type="text"
            placeholder="Antwort eingeben …"
            autocomplete="off">

          <button
            class="check-button"
            onclick="checkAnswer()"
            style="width:100%; margin-top:10px;">
            ANTWORT PRÜFEN / ANZEIGEN
          </button>

          <div
            id="checkResult"
            class="check-result">
          </div>

        </div>

      </div>

      <div class="controls">

        <button
          class="back-button"
          onclick="previousWord()">
          ← ZURÜCK
        </button>

      </div>

    </div>


    <div class="add-section">

      <div class="section-title">
        + VOKABEL HINZUFÜGEN
      </div>

      <input
        id="newEnglish"
        class="add-input"
        type="text"
        placeholder="Englisch">

      <input
        id="newGerman"
        class="add-input"
        type="text"
        placeholder="Deutsch">

      <button
        class="translation-button"
        onclick="findTranslation()">
        🔍 ÜBERSETZUNG SUCHEN
      </button>

      <div
        id="translationStatus"
        class="translation-status">
      </div>

      <button
        class="save-button"
        onclick="saveVocabulary()">
        VOKABEL SPEICHERN
      </button>

    </div>


    <div class="add-section">

      <div class="section-title">
        VOKABEL-DATEI
      </div>

      <button
        class="export-button"
        onclick="exportCSV()">
        ⬇️ CSV EXPORTIEREN
      </button>

      <button
        class="delete-button"
        onclick="deleteLocalVocabulary()">
        LOKALE VOKABELN LÖSCHEN
      </button>

    </div>

  </div>

</div>


<script>

  let vocabulary = [];
  let csvVocabulary = [];
  let currentIndex = 0;
  let currentDirection = "en-de";

  let practicedWords =
    JSON.parse(localStorage.getItem("practicedWords") || "[]");

  let localVocabulary =
    JSON.parse(localStorage.getItem("localVocabulary") || "[]");


  function normalize(text) {
    return String(text || "")
      .toLowerCase()
      .trim()
      .replace(/\s+/g, " ");
  }


  function parseCSV(text) {

    const lines = text
      .replace(/^\uFEFF/, "")
      .split(/\r?\n/)
      .filter(line => line.trim() !== "");

    if (lines.length === 0) {
      return [];
    }

    const rows = lines.map(line => {

      const result = [];
      let current = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {

        const char = line[i];

        if (char === '"') {

          if (
            insideQuotes &&
            line[i + 1] === '"'
          ) {
            current += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }

        } else if (
          char === "," &&
          !insideQuotes
        ) {
          result.push(current);
          current = "";

        } else {
          current += char;
        }
      }

      result.push(current);

      return result;
    });

    const header = rows[0].map(cell =>
      normalize(cell)
    );

    let englishIndex =
      header.indexOf("english");

    let germanIndex =
      header.indexOf("deutsch");

    if (englishIndex === -1) {
      englishIndex = 0;
    }

    if (germanIndex === -1) {
      germanIndex = 4;
    }

    const result = [];

    for (let i = 1; i < rows.length; i++) {

      const english =
        (rows[i][englishIndex] || "").trim();

      const german =
        (rows[i][germanIndex] || "").trim();

      if (english && german) {

        result.push({
          english,
          german
        });
      }
    }

    return result;
  }


  async function loadVocabulary() {

    try {

      const csvUrl =
        new URL(
          "vocabulary.csv",
          window.location.href
        ).href +
        "?v=" +
        Date.now();

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () => controller.abort(),
          10000
        );

      const response =
        await fetch(
          csvUrl,
          {
            cache: "no-store",
            signal: controller.signal
          }
        );

      clearTimeout(timeout);

      if (!response.ok) {
        throw new Error(
          "CSV konnte nicht geladen werden."
        );
      }

      const text =
        await response.text();

      csvVocabulary =
        parseCSV(text);

      // Nur die Einträge aus der CSV anzeigen
      document.getElementById("csvCount").textContent =
        csvVocabulary.length;

      vocabulary =
        mergeVocabulary(
          csvVocabulary,
          localVocabulary
        );

      if (vocabulary.length === 0) {
        throw new Error(
          "Keine Vokabeln gefunden."
        );
      }

      document.getElementById("loading").style.display =
        "none";

      document.getElementById("app").style.display =
        "block";

      nextWord();

    } catch (error) {

      console.error(error);

      document.getElementById("loading").innerHTML =
        "Fehler beim Laden der vocabulary.csv.<br><br>" +
        error.message;

    }
  }


  function mergeVocabulary(csvWords, localWords) {

    const combined = [
      ...csvWords,
      ...localWords
    ];

    const seen = new Set();
    const result = [];

    combined.forEach(item => {

      const key =
        normalize(item.english) +
        "||" +
        normalize(item.german);

      if (!seen.has(key)) {

        seen.add(key);
        result.push(item);

      }

    });

    return result;
  }


  function nextWord() {

    if (vocabulary.length === 0) {
      return;
    }

    currentIndex =
      Math.floor(
        Math.random() * vocabulary.length
      );

    currentDirection =
      Math.random() < 0.5
        ? "en-de"
        : "de-en";

    displayCurrentWord();
  }


  function displayCurrentWord() {

    const item =
      vocabulary[currentIndex];

    const questionWord =
      document.getElementById("questionWord");

    const answerWord =
      document.getElementById("answerWord");

    const questionLanguage =
      document.getElementById("questionLanguage");

    const answerLanguage =
      document.getElementById("answerLanguage");

    const direction =
      document.getElementById("direction");

    const showButton =
      document.getElementById("showButton");

    answerWord.classList.add(
      "answer-hidden"
    );

    showButton.textContent =
      "ANZEIGEN";

    document.getElementById("answerInput").value =
      "";

    document.getElementById("checkResult").textContent =
      "";

    if (currentDirection === "en-de") {

      questionLanguage.textContent =
        "English";

      answerLanguage.textContent =
        "Deutsch";

      questionWord.textContent =
        item.english.toLowerCase();

      answerWord.textContent =
        item.german;

      direction.textContent =
        "English → Deutsch";

    } else {

      questionLanguage.textContent =
        "Deutsch";

      answerLanguage.textContent =
        "English";

      questionWord.textContent =
        item.german.toLowerCase();

      answerWord.textContent =
        item.english;

      direction.textContent =
        "Deutsch → English";
    }

  }


  function speakEnglish() {

    if (
      !window.speechSynthesis ||
      vocabulary.length === 0
    ) {
      return;
    }

    const englishText =
      vocabulary[currentIndex].english;

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        englishText
      );

    utterance.lang = "en-US";
    utterance.rate = 0.9;
    utterance.pitch = 1;

    const voices =
      window.speechSynthesis.getVoices();

    const englishVoice =
      voices.find(
        voice =>
          voice.lang &&
          voice.lang.toLowerCase() === "en-us"
      ) ||
      voices.find(
        voice =>
          voice.lang &&
          voice.lang.toLowerCase().startsWith("en")
      );

    if (englishVoice) {
      utterance.voice = englishVoice;
    }

    window.speechSynthesis.speak(
      utterance
    );
  }


  function showAnswerAndNext() {

    const answerWord =
      document.getElementById("answerWord");

    const showButton =
      document.getElementById("showButton");

    if (
      answerWord.classList.contains(
        "answer-hidden"
      )
    ) {

      answerWord.classList.remove(
        "answer-hidden"
      );

      showButton.textContent =
        "NÄCHSTE →";

      markAsPracticed();

      setTimeout(
        () => {
          nextWord();
        },
        900
      );

    } else {

      nextWord();

    }
  }


  function previousWord() {

    if (vocabulary.length === 0) {
      return;
    }

    currentIndex =
      (currentIndex - 1 + vocabulary.length) %
      vocabulary.length;

    currentDirection =
      Math.random() < 0.5
        ? "en-de"
        : "de-en";

    displayCurrentWord();
  }


  function markAsPracticed() {

    const item =
      vocabulary[currentIndex];

    const key =
      normalize(item.english) +
      "||" +
      normalize(item.german);

    if (!practicedWords.includes(key)) {

      practicedWords.push(key);

      localStorage.setItem(
        "practicedWords",
        JSON.stringify(practicedWords)
      );

    }

    updateStats();
  }


  function updateStats() {

    document.getElementById(
      "practicedCount"
    ).textContent =
      practicedWords.length;

  }


  function isAnswerCorrect(
    userAnswer,
    correctAnswer
  ) {

    const normalizedUser =
      normalize(userAnswer);

    const possibleAnswers =
      String(correctAnswer)
        .split("/")
        .map(answer =>
          normalize(answer)
        )
        .filter(Boolean);

    return possibleAnswers.includes(
      normalizedUser
    );
  }


  function checkAnswer() {

    const input =
      document.getElementById(
        "answerInput"
      );

    const result =
      document.getElementById(
        "checkResult"
      );

    const answerWord =
      document.getElementById(
        "answerWord"
      );

    const userAnswer =
      input.value.trim();

    if (!userAnswer) {

      answerWord.classList.remove(
        "answer-hidden"
      );

      result.textContent =
        "";

      markAsPracticed();

      return;
    }

    const correctAnswer =
      currentDirection === "en-de"
        ? vocabulary[currentIndex].german
        : vocabulary[currentIndex].english;

    if (
      isAnswerCorrect(
        userAnswer,
        correctAnswer
      )
    ) {

      result.textContent =
        "✓ Richtig";

      answerWord.classList.remove(
        "answer-hidden"
      );

      markAsPracticed();

      setTimeout(
        () => {
          nextWord();
        },
        900
      );

    } else {

      result.textContent =
        "✗ Nicht ganz – richtige Antwort:";

      answerWord.classList.remove(
        "answer-hidden"
      );

      markAsPracticed();

    }

  }


  function toggleAnswerInput() {

    const area =
      document.getElementById(
        "answerInputArea"
      );

    area.classList.toggle(
      "visible"
    );

  }


  function setupTranslationInputs() {

    const englishInput =
      document.getElementById(
        "newEnglish"
      );

    const germanInput =
      document.getElementById(
        "newGerman"
      );

    englishInput.addEventListener(
      "input",
      () => {

        if (
          englishInput.value.trim()
        ) {
          germanInput.value = "";
        }

        document.getElementById(
          "translationStatus"
        ).textContent = "";

      }
    );

    germanInput.addEventListener(
      "input",
      () => {

        if (
          germanInput.value.trim()
        ) {
          englishInput.value = "";
        }

        document.getElementById(
          "translationStatus"
        ).textContent = "";

      }
    );

  }


  async function findTranslation() {

    const englishInput =
      document.getElementById(
        "newEnglish"
      );

    const germanInput =
      document.getElementById(
        "newGerman"
      );

    const status =
      document.getElementById(
        "translationStatus"
      );

    const english =
      englishInput.value.trim();

    const german =
      germanInput.value.trim();

    if (
      english &&
      german
    ) {

      status.textContent =
        "Bitte nur Englisch oder Deutsch eingeben.";

      return;
    }

    if (!english && !german) {

      status.textContent =
        "Bitte Englisch oder Deutsch eingeben.";

      return;
    }

    status.textContent =
      "Übersetzung wird gesucht …";

    try {

      let query;
      let langPair;

      if (english) {

        query = english;
        langPair = "en|de";

      } else {

        query = german;
        langPair = "de|en";

      }

      const url =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(query) +
        "&langpair=" +
        langPair;

      const response =
        await fetch(url);

      const data =
        await response.json();

      if (
        !data ||
        !data.responseData ||
        !data.responseData.translatedText
      ) {

        throw new Error(
          "Keine Übersetzung gefunden."
        );

      }

      const translation =
        data.responseData.translatedText.trim();

      if (english) {

        germanInput.value =
          translation;

      } else {

        englishInput.value =
          translation;

      }

      status.textContent =
        "Übersetzung gefunden.";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Übersetzung konnte nicht gefunden werden.";

    }

  }


  function saveVocabulary() {

    const englishInput =
      document.getElementById(
        "newEnglish"
      );

    const germanInput =
      document.getElementById(
        "newGerman"
      );

    const status =
      document.getElementById(
        "translationStatus"
      );

    const english =
      englishInput.value.trim();

    const german =
      germanInput.value.trim();

    if (!english || !german) {

      status.textContent =
        "Bitte Englisch und Deutsch ausfüllen.";

      return;
    }

    const duplicate =
      vocabulary.some(
        item =>
          normalize(item.english) ===
            normalize(english) &&
          normalize(item.german) ===
            normalize(german)
      );

    if (duplicate) {

      status.textContent =
        "Diese Vokabel ist bereits vorhanden.";

      return;
    }

    const newWord = {
      english,
      german
    };

    localVocabulary.push(
      newWord
    );

    localStorage.setItem(
      "localVocabulary",
      JSON.stringify(localVocabulary)
    );

    vocabulary =
      mergeVocabulary(
        csvVocabulary,
        localVocabulary
      );

    englishInput.value =
      "";

    germanInput.value =
      "";

    status.textContent =
      "Vokabel wurde gespeichert.";

  }


  function deleteLocalVocabulary() {

    const confirmed =
      confirm(
        "Möchtest du wirklich alle lokal hinzugefügten Vokabeln löschen?"
      );

    if (!confirmed) {
      return;
    }

    localVocabulary = [];

    localStorage.removeItem(
      "localVocabulary"
    );

    vocabulary =
      mergeVocabulary(
        csvVocabulary,
        localVocabulary
      );

    alert(
      "Lokale Vokabeln wurden gelöscht."
    );

  }


  function csvEscape(value) {

    const text =
      String(value ?? "");

    if (
      text.includes(",") ||
      text.includes('"') ||
      text.includes("\n") ||
      text.includes("\r")
    ) {

      return '"' +
        text.replace(
          /"/g,
          '""'
        ) +
        '"';

    }

    return text;
  }


  function exportCSV() {

    const header =
      [
        "English",
        "Verb + preposition/construction",
        "Noun",
        "Adjective/Participle",
        "Deutsch"
      ];

    const rows = [
      header
    ];

    vocabulary.forEach(
      item => {

        rows.push([
          item.english,
          "",
          "",
          "",
          item.german
        ]);

      }
    );

    const csv =
      rows
        .map(
          row =>
            row
              .map(csvEscape)
              .join(",")
        )
        .join("\r\n");

    const blob =
      new Blob(
        [
          "\uFEFF" + csv
        ],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;
    link.download =
      "vocabulary.csv";

    document.body.appendChild(
      link
    );

    link.click();

    document.body.removeChild(
      link
    );

    URL.revokeObjectURL(
      url
    );

  }


  function start() {

    updateStats();

    setupTranslationInputs();

    loadVocabulary();

  }


  start();

</script>

</body>
</html>
