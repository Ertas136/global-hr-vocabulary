<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global HR Vocabulary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #status {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .question {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 35px 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }

    #result {
      text-align: center;
      font-size: 20px;
      margin-top: 20px;
      min-height: 30px;
    }

    .stats {
      text-align: center;
      margin-top: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Global HR Vocabulary</h1>

  <div id="status">Vokabelliste wird geladen...</div>

  <div class="question" id="question">Bitte warten...</div>

  <input
    type="text"
    id="answer"
    placeholder="Deine Antwort"
    autocomplete="off"
  >

  <button id="checkButton" onclick="checkAnswer()" disabled>
    Antwort prüfen
  </button>

  <button onclick="nextQuestion()">
    Nächste Vokabel
  </button>

  <div id="result"></div>

  <div class="stats">
    Richtig: <span id="correct">0</span> |
    Falsch: <span id="wrong">0</span>
  </div>

</div>

<script>
  let vocabulary = [];
  let currentWord = null;
  let direction = null;

  let correct = 0;
  let wrong = 0;

  async function loadVocabulary() {
    try {
      const response = await fetch("vocabulary.csv?t=" + Date.now());

      if (!response.ok) {
        throw new Error("CSV konnte nicht geladen werden.");
      }

      const text = await response.text();

      vocabulary = parseCSV(text);

      if (vocabulary.length === 0) {
        throw new Error("Keine Vokabeln gefunden.");
      }

      document.getElementById("status").textContent =
        vocabulary.length + " Vokabeln geladen";

      document.getElementById("checkButton").disabled = false;

      nextQuestion();

    } catch (error) {
      document.getElementById("status").textContent =
        "Fehler beim Laden der Vokabelliste.";

      document.getElementById("question").textContent =
        error.message;
    }
  }

  function parseCSV(text) {
    const lines = text
      .split(/\r?\n/)
      .filter(line => line.trim() !== "");

    const result = [];

    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);

      if (!parts || parts.length < 2) continue;

      const english = parts[0]
        .replace(/^"|"$/g, "")
        .trim();

      const german = parts[1]
        .replace(/^"|"$/g, "")
        .trim();

      if (english && german) {
        result.push({
          english: english,
          german: german
        });
      }
    }

    return result;
  }

  function nextQuestion() {
    if (vocabulary.length === 0) return;

    currentWord =
      vocabulary[Math.floor(Math.random() * vocabulary.length)];

    direction = Math.random() < 0.5 ? "de-en" : "en-de";

    if (direction === "de-en") {
      document.getElementById("question").textContent =
        currentWord.german;
    } else {
      document.getElementById("question").textContent =
        currentWord.english;
    }

    document.getElementById("answer").value = "";
    document.getElementById("result").textContent = "";

    document.getElementById("answer").focus();
  }

  function checkAnswer() {
    const userAnswer =
      document.getElementById("answer").value.trim().toLowerCase();

    if (!userAnswer) return;

    let correctAnswer;

    if (direction === "de-en") {
      correctAnswer = currentWord.english;
    } else {
      correctAnswer = currentWord.german;
    }

    const normalizedCorrect =
      correctAnswer.trim().toLowerCase();

    if (userAnswer === normalizedCorrect) {
      correct++;
      document.getElementById("result").textContent =
        "✅ Richtig!";
    } else {
      wrong++;
      document.getElementById("result").textContent =
        "❌ Falsch – richtig wäre: " + correctAnswer;
    }

    document.getElementById("correct").textContent = correct;
    document.getElementById("wrong").textContent = wrong;
  }

  document.getElementById("answer").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      checkAnswer();
    }
  });

  loadVocabulary();
</script>

</body>
</html>
