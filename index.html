<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global HR Vocabulary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #e9e9e9;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 620px;
    }

    .title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    /* Vokabelblatt */
    .card {
      background: #fff;
      min-height: 430px;
      border-radius: 6px;
      padding: 45px 35px 35px;
      box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.08),
        0 12px 30px rgba(0, 0, 0, 0.10);

      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* kleine Linie oben wie auf einem Blatt */
    .card::before {
      content: "";
      position: absolute;
      top: 28px;
      left: 35px;
      right: 35px;
      height: 1px;
      background: #ddd;
    }

    .direction {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .question {
      text-align: center;
      font-size: 38px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 25px;
      word-break: break-word;
    }

    .separator {
      width: 80px;
      height: 2px;
      background: #ddd;
      margin: 0 auto 25px;
    }

    .answer {
      text-align: center;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.3;
      min-height: 40px;
      color: #444;
      word-break: break-word;
    }

    /* Buttons */
    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 19px;
      margin-top: 16px;
      font-size: 21px;
      font-weight: 700;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    #nextButton {
      display: none;
    }

    .status {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 16px;
    }

    /* Smartphone */
    @media (max-width: 500px) {

      body {
        padding: 15px;
        align-items: flex-start;
        padding-top: 35px;
      }

      .title {
        font-size: 22px;
        margin-bottom: 15px;
      }

      .card {
        min-height: 390px;
        padding: 40px 22px 30px;
      }

      .card::before {
        left: 22px;
        right: 22px;
      }

      .question {
        font-size: 32px;
      }

      .answer {
        font-size: 27px;
      }

      button {
        font-size: 20px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="title">
      Global HR Vocabulary
    </div>

    <div class="card">

      <div class="direction" id="direction">
        Vokabelliste wird geladen...
      </div>

      <div class="question" id="question">
        Bitte warten...
      </div>

      <div class="separator"></div>

      <div class="answer" id="answer"></div>

    </div>

    <button id="showButton" onclick="showAnswer()">
      ANZEIGEN
    </button>

    <button id="nextButton" onclick="nextQuestion()">
      NÄCHSTE VOKABEL
    </button>

    <div class="status" id="status"></div>

  </div>


  <script>

    let vocabulary = [];
    let currentWord = null;
    let direction = null;


    async function loadVocabulary() {

      try {

        const response =
          await fetch("vocabulary.csv?t=" + Date.now());

        if (!response.ok) {
          throw new Error(
            "Vokabelliste konnte nicht geladen werden."
          );
        }

        const text = await response.text();

        vocabulary = parseCSV(text);

        if (vocabulary.length === 0) {
          throw new Error(
            "Keine Vokabeln gefunden."
          );
        }

        document.getElementById("status").textContent =
          vocabulary.length + " Vokabeln geladen";

        nextQuestion();

      } catch (error) {

        document.getElementById("question").textContent =
          error.message;

        document.getElementById("showButton").style.display =
          "none";

      }

    }


    function parseCSV(text) {

      const lines = text
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

      const result = [];


      for (let i = 1; i < lines.length; i++) {

        const line = lines[i];

        const parts =
          line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);

        if (!parts || parts.length < 2) {
          continue;
        }


        const english =
          parts[0]
            .replace(/^"|"$/g, "")
            .trim();

        const german =
          parts[1]
            .replace(/^"|"$/g, "")
            .trim();


        if (english && german) {

          result.push({
            english: english,
            german: german
          });

        }

      }

      return result;

    }


    function nextQuestion() {

      if (vocabulary.length === 0) {
        return;
      }


      currentWord =
        vocabulary[
          Math.floor(
            Math.random() * vocabulary.length
          )
        ];


      direction =
        Math.random() < 0.5
          ? "de-en"
          : "en-de";


      document.getElementById("answer").textContent =
        "";


      if (direction === "de-en") {

        document.getElementById("direction").textContent =
          "Deutsch → Englisch";

        document.getElementById("question").textContent =
          currentWord.german;

      } else {

        document.getElementById("direction").textContent =
          "Englisch → Deutsch";

        document.getElementById("question").textContent =
          currentWord.english;

      }


      document.getElementById("showButton").style.display =
        "block";

      document.getElementById("nextButton").style.display =
        "none";

    }


    function showAnswer() {

      if (!currentWord) {
        return;
      }


      if (direction === "de-en") {

        document.getElementById("answer").textContent =
          currentWord.english;

      } else {

        document.getElementById("answer").textContent =
          currentWord.german;

      }


      document.getElementById("showButton").style.display =
        "none";

      document.getElementById("nextButton").style.display =
        "block";

    }


    loadVocabulary();

  </script>

</body>
</html>
