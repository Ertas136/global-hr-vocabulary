<body>

<script>
/* =========================================
   GRUNDLAGEN
========================================= */

const $ = id => document.getElementById(id);

function readStorage(name, fallback) {
  try {
    return JSON.parse(localStorage.getItem(name)) ?? fallback;
  } catch (error) {
    return fallback;
  }
}

let vocabulary = [];
let csvVocabulary = [];
let localVocabulary = readStorage("localVocabulary", []);
let progress = readStorage("hrProgress", {});
let difficultWords = readStorage("difficultWords", []);

let currentIndex = 0;
let mode = "learn";

let currentAttempt = {
  revealed: false,
  assessed: false
};

let learningRound = [];
let learningRoundPosition = 0;
let learningRoundNumber = 0;

let history = [];
let speechTimer = null;

/* =========================================
   NORMALISIERUNG
========================================= */

function normalize(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/\s+/g, " ");
}

function key(item) {
  return normalize(item.English) +
    "|" +
    normalize(item.Deutsch);
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* =========================================
   LERNFORTSCHRITT
========================================= */

function getProgress(item) {
  const p = progress[key(item)] || {};

  return {
    seen: p.seen || 0,
    correct: p.correct || 0,
    wrong: p.wrong || 0,
    revealed: p.revealed || 0,
    lastSeen: p.lastSeen || 0,
    nextDue: p.nextDue || 0,
    difficulty: p.difficulty || "",
    difficultyCount: p.difficultyCount || {
      easy: 0,
      medium: 0,
      hard: 0
    }
  };
}

function saveProgress() {
  localStorage.setItem(
    "hrProgress",
    JSON.stringify(progress)
  );

  localStorage.setItem(
    "difficultWords",
    JSON.stringify(difficultWords)
  );
}

/* =========================================
   CSV PARSER
========================================= */

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if ((c === "," || c === ";") && !quoted) {
      row.push(cell.trim());
      cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i + 1] === "\n") i++;

      row.push(cell.trim());
      cell = "";

      if (row.some(x => x !== "")) {
        rows.push(row);
      }

      row = [];
    } else {
      cell += c;
    }
  }

  row.push(cell.trim());

  if (row.some(x => x !== "")) {
    rows.push(row);
  }

  if (!rows.length) return [];

  const first = rows[0].map(
    x => x.replace(/^\uFEFF/, "")
  );

  const hasHeader = first.some(
    x => /^(English|Deutsch|German|Example|Example sentence)$/i.test(x)
  );

  const headers = hasHeader ? first : [];
  const data = hasHeader ? rows.slice(1) : rows;

  return data.map(r => {
    const o = {};

    headers.forEach((h, i) => {
      o[h] = (r[i] || "").trim();
    });

    if (hasHeader) {
      return {
        English: o.English || r[0] || "",
        Deutsch: o.Deutsch || o.German || r[1] || "",
        "Verb + preposition/construction":
          o["Verb + preposition/construction"] ||
          o["Verb / related construction"] ||
          o.construction ||
          r[2] || "",
        Noun:
          o.Noun ||
          o["Noun / related form"] ||
          o.Nomen ||
          r[3] || "",
        "Adjective/Participle":
          o["Adjective/Participle"] ||
          o["Adjective / participle"] ||
          o.Adjective ||
          r[4] || "",
        Adverb: o.Adverb || "",
        Example:
          o.Example ||
          o["Example sentence"] ||
          o["Example sentence(s)"] ||
          r[6] || ""
      };
    }

    // Headerlose CSV mit sechs Spalten
    return {
      English: r[0] || "",
      Deutsch: r[1] || "",
      "Verb + preposition/construction": r[2] || "",
      "Adjective/Participle": r[3] || "",
      Noun: r[4] || "",
      Adverb: "",
      Example: r[5] || ""
    };
  }).filter(x => x.English || x.Deutsch);
}

/* =========================================
   VOKABELN LADEN
========================================= */

function mergeVocabulary() {
  const seen = new Set();

  vocabulary = [
    ...csvVocabulary,
    ...localVocabulary
  ].filter(item => {
    const k = key(item);

    if (seen.has(k)) return false;
    if (!item.English && !item.Deutsch) return false;

    seen.add(k);
    return true;
  });
}

async function loadVocabulary() {
  try {
    const url = new URL(
      "vocabulary.csv",
      window.location.href
    );

    url.searchParams.set("v", Date.now());

    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      10000
    );

    try {
      const response = await fetch(url, {
        signal: controller.signal
      });

      if (response.ok) {
        csvVocabulary = parseCSV(
          await response.text()
        );
      }
    } finally {
      clearTimeout(timeout);
    }
  } catch (error) {
    console.warn(
      "CSV konnte nicht geladen werden:",
      error
    );
  }

  mergeVocabulary();
  createLearningRound();

  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");

  updateStats();

  if (vocabulary.length) {
    nextWord(true);
  } else {
    $("loading").textContent =
      "Keine Vokabeln gefunden.";
    $("loading").classList.remove("hidden");
  }
}

/* =========================================
   ZUFALLSAUSWAHL
========================================= */

function shuffleArray(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(
      Math.random() * (i + 1)
    );

    [result[i], result[j]] =
      [result[j], result[i]];
  }

  return result;
}

/* =========================================
   ADAPTIVES LERNSYSTEM

   EASY: jede 5. Runde
   MEDIUM: 1x pro Runde
   HARD: 3x pro Runde
   NEU: 1x bis 3x pro Runde
========================================= */

function repetitionsFor(item, index) {
  const p = getProgress(item);

  if (p.difficulty === "easy") {
    return learningRoundNumber % 5 === 0 ? 1 : 0;
  }

  if (p.difficulty === "medium") {
    return 1;
  }

  if (p.difficulty === "hard") {
    return 3;
  }

  const total = vocabulary.length;

  const recentStart = Math.floor(total * .85);
  const middleStart = Math.floor(total * .60);

  if (index >= recentStart) {
    return 3;
  }

  if (index >= middleStart) {
    return 2;
  }

  return 1;
}

function separateDuplicates(items, previous = -1) {
  for (let i = 0; i < items.length; i++) {
    const before = i === 0
      ? previous
      : items[i - 1];

    if (items[i] === before) {
      const swapIndex = items.findIndex(
        (candidate, j) =>
          j > i &&
          candidate !== before &&
          (
            j === items.length - 1 ||
            items[j + 1] !== items[i]
          )
      );

      if (swapIndex !== -1) {
        [items[i], items[swapIndex]] =
          [items[swapIndex], items[i]];
      }
    }
  }

  return items;
}

function createLearningRound() {
  learningRoundNumber++;

  const weightedIndices = [];

  vocabulary.forEach((item, index) => {
    const repetitions = repetitionsFor(
      item,
      index
    );

    for (let n = 0; n < repetitions; n++) {
      weightedIndices.push(index);
    }
  });

  if (!weightedIndices.length) {
    vocabulary.forEach((_, index) => {
      weightedIndices.push(index);
    });
  }

  learningRound = separateDuplicates(
    shuffleArray(weightedIndices),
    currentIndex
  );

  learningRoundPosition = 0;
}

function getNextLearningIndex() {
  if (!vocabulary.length) {
    return 0;
  }

  if (
    !learningRound.length ||
    learningRoundPosition >= learningRound.length
  ) {
    createLearningRound();
  }

  return learningRound[learningRoundPosition++];
}

/* =========================================
   MODI
========================================= */

function setMode(newMode) {
  stopSpeech();

  mode = newMode;

  $("learnMode").classList.toggle(
    "active",
    mode === "learn"
  );

  $("testMode").classList.toggle(
    "active",
    mode === "test"
  );

  $("modeStatus").textContent =
    mode === "test"
      ? "Testmodus: Englisch → Deutsch"
      : "Englisch ↔ Deutsch";

  nextWord();
}

/* =========================================
   NAVIGATION
========================================= */

function nextWord(initial = false) {
  if (!vocabulary.length) return;

  stopSpeech();

  if (!initial) {
    history.push(currentIndex);
  }

  currentIndex = getNextLearningIndex();

  currentAttempt = {
    revealed: false,
    assessed: false
  };

  displayWord();
}

function previousWord() {
  if (!vocabulary.length || !history.length) {
    return;
  }

  stopSpeech();

  currentIndex = history.pop();

  currentAttempt = {
    revealed: false,
    assessed: false
  };

  displayWord();
}

/* =========================================
   SCHWIERIGKEITSTEXTE
========================================= */

function difficultyText(value) {
  if (value === "easy") {
    return "🟢 BEHERRSCHE ICH";
  }

  if (value === "medium") {
    return "🟡 NOCH NICHT SICHER";
  }

  if (value === "hard") {
    return "🔴 BEHERRSCHE ICH NICHT";
  }

  return "NEU";
}

/* =========================================
   STERN-MARKIERUNG
========================================= */

function starHTML() {
  const item = vocabulary[currentIndex];

  const active = difficultWords.includes(
    key(item)
  );

  return `
    <button
      class="star"
      onclick="toggleDifficult(event)">
      ${active ? "★" : "☆"}
    </button>
  `;
}

/* =========================================
   DARSTELLUNG
========================================= */

function displayWord() {
  const item = vocabulary[currentIndex];

  if (!item) return;

  const p = getProgress(item);

  $("counter").textContent =
    `${currentIndex + 1} / ${vocabulary.length}`;

  $("difficultyText").textContent =
    difficultyText(p.difficulty);

  $("questionDetails").innerHTML = "";
  $("answerDetails").innerHTML = "";

  $("answerWord").classList.add(
    "answer-hidden"
  );

  $("answerDetails").classList.add(
    "answer-hidden"
  );

  $("exampleArea").classList.add(
    "answer-hidden"
  );

  $("exampleText").innerHTML = "";

  $("sentenceButton").textContent = "SATZ";
  $("sentenceButton").disabled = !item.Example;
  $("sentenceButton").style.opacity =
    item.Example ? "1" : ".45";

  const deToEn =
    mode === "learn" && Math.random() < .5;

  const english = escapeHtml(
    item.English.toLowerCase()
  );

  const german = escapeHtml(
    item.Deutsch.toLowerCase()
  );

  const audio = `
    <button
      class="speaker"
      onclick="speakEnglish(event)">
      🔊
    </button>
  `;

  $("questionLanguage").textContent =
    deToEn ? "DEUTSCH" : "ENGLISH";

  $("answerLanguage").textContent =
    deToEn ? "ENGLISH" : "DEUTSCH";

  if (deToEn) {
    $("questionWord").innerHTML = german;

    $("answerWord").innerHTML =
      english + " " + audio + " " + starHTML();
  } else {
    $("questionWord").innerHTML =
      english + " " + audio + " " + starHTML();

    $("answerWord").innerHTML = german;
  }

  updateDifficultyButtons();
  updateProgress();
}

/* =========================================
   WORTDETAILS
========================================= */

function renderDetails(item) {
  let html = "";

  const fields = [
    [
      "Verb",
      item["Verb + preposition/construction"]
    ],
    [
      "Nomen",
      item.Noun
    ],
    [
      "Adjektiv/Partizip",
      item["Adjective/Participle"]
    ],
    [
      "Adverb",
      item.Adverb
    ]
  ];

  fields.forEach(([label, value]) => {
    if (value) {
      html += `
        <div class="detail">
          <strong>${label}:</strong>
          ${escapeHtml(value)}
        </div>
      `;
    }
  });

  return html;
}

/* =========================================
   BEISPIELSATZ
========================================= */

function showSentence() {
  const item = vocabulary[currentIndex];

  if (!item || !item.Example) {
    return;
  }

  $("exampleArea").classList.remove(
    "answer-hidden"
  );

  $("exampleText").innerHTML = `
    <strong>Englischer Beispielsatz:</strong>
    ${escapeHtml(item.Example)}
    <button
      class="speaker"
      onclick="speakExample(event)"
      aria-label="Satz vorlesen">
      🔊
    </button>
  `;

  $("sentenceButton").textContent =
    "SATZ ANGEZEIGT";
}

/* =========================================
   EIN-KLICK-BEWERTUNG

   Ein Klick:
   1. Bewertung speichern
   2. Lösung anzeigen
   3. Beispielsatz anzeigen
   4. Englisches Wort vorlesen

   WEITER erfolgt ausschließlich manuell.
========================================= */

function setDifficulty(level) {
  const item = vocabulary[currentIndex];

  if (!item) return;

  // Nur eine Bewertung pro Karte
  if (currentAttempt.assessed) {
    return;
  }

  const p = getProgress(item);

  currentAttempt.assessed = true;
  currentAttempt.revealed = true;

  p.seen++;
  p.revealed++;
  p.lastSeen = Date.now();

  p.difficulty = level;

  if (!p.difficultyCount) {
    p.difficultyCount = {
      easy: 0,
      medium: 0,
      hard: 0
    };
  }

  p.difficultyCount[level]++;

  if (level === "easy") {
    p.correct++;
  }

  if (level === "hard") {
    p.wrong++;
  }

  progress[key(item)] = p;

  if (level === "hard") {
    if (!difficultWords.includes(key(item))) {
      difficultWords.push(key(item));
    }
  } else {
    difficultWords = difficultWords.filter(
      x => x !== key(item)
    );
  }

  /* Zukünftige Wiederholungen
     innerhalb der laufenden Runde anpassen */

  const prefix = learningRound.slice(
    0,
    learningRoundPosition
  );

  let remaining = learningRound
    .slice(learningRoundPosition)
    .filter(index => index !== currentIndex);

  let extra = 0;

  if (level === "hard") {
    extra = 3;
  } else if (level === "medium") {
    extra = 1;
  }

  for (let i = 0; i < extra; i++) {
    const minGap = Math.min(
      5,
      remaining.length
    );

    const position = minGap + Math.floor(
      Math.random() *
      (remaining.length - minGap + 1)
    );

    remaining.splice(
      position,
      0,
      currentIndex
    );
  }

  remaining = separateDuplicates(
    remaining,
    currentIndex
  );

  learningRound = [
    ...prefix,
    ...remaining
  ];

  saveProgress();

  /* Lösung unmittelbar anzeigen */

  $("answerWord").classList.remove(
    "answer-hidden"
  );

  $("answerDetails").classList.remove(
    "answer-hidden"
  );

  $("answerDetails").innerHTML =
    renderDetails(item);

  /* Beispielsatz automatisch anzeigen */

  if (item.Example) {
    showSentence();
  }

  /* Bewertung optisch hervorheben */

  $("difficultyText").textContent =
    difficultyText(level);

  updateDifficultyButtons();
  updateStats();
  updateProgress();

  /* Englisches Wort vorlesen */

  stopSpeech();

  speechTimer = setTimeout(
    () => speakEnglish(),
    600
  );

  if (navigator.vibrate) {
    navigator.vibrate(20);
  }

  /* Kein automatisches Weiterblättern */
}

/* =========================================
   BEWERTUNGSBUTTONS
========================================= */

function updateDifficultyButtons() {
  const item = vocabulary[currentIndex];

  if (!item) return;

  const p = getProgress(item);

  ["easy", "medium", "hard"].forEach(level => {
    const button = $(level + "Button");

    button.classList.toggle(
      "selected",
      p.difficulty === level
    );

    button.disabled = currentAttempt.assessed;
  });
}

/* =========================================
   AUDIO
========================================= */

function stopSpeech() {
  if (speechTimer) {
    clearTimeout(speechTimer);
    speechTimer = null;
  }

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

function speakText(text, lang = "en-US") {
  if (!text) return;

  if (!("speechSynthesis" in window)) {
    return;
  }

  stopSpeech();

  const u = new SpeechSynthesisUtterance(text);

  u.lang = lang;
  u.rate = .9;
  u.pitch = 1;

  const voices = speechSynthesis.getVoices();

  u.voice =
    voices.find(v => v.lang === lang) ||
    voices.find(
      v => v.lang && v.lang.startsWith(
        lang.slice(0, 2)
      )
    ) ||
    null;

  speechSynthesis.speak(u);
}

function speakEnglish(event) {
  if (event) {
    event.stopPropagation();
  }

  const item = vocabulary[currentIndex];

  if (item && item.English) {
    speakText(item.English, "en-US");
  }
}

function speakExample(event) {
  if (event) {
    event.stopPropagation();
  }

  const item = vocabulary[currentIndex];

  if (item && item.Example) {
    speakText(item.Example, "en-US");
  }
}

/* =========================================
   SCHWIERIGE WÖRTER MARKIEREN
========================================= */

function toggleDifficult(event) {
  if (event) {
    event.stopPropagation();
  }

  const item = vocabulary[currentIndex];

  if (!item) return;

  const k = key(item);

  if (difficultWords.includes(k)) {
    difficultWords = difficultWords.filter(
      x => x !== k
    );
  } else {
    difficultWords.push(k);
  }

  saveProgress();
  displayWord();
  updateStats();
}

/* =========================================
   FORTSCHRITTSANZEIGE
========================================= */

function updateProgress() {
  const item = vocabulary[currentIndex];

  if (!item) return;

  const p = getProgress(item);

  let score = 20;

  score += p.correct * 14;
  score -= p.wrong * 8;

  if (p.difficulty === "easy") {
    score += 20;
  }

  if (p.difficulty === "hard") {
    score -= 15;
  }

  score = Math.max(
    5,
    Math.min(100, score)
  );

  $("progressFill").style.width =
    score + "%";
}

/* =========================================
   STATISTIK
========================================= */

function updateStats() {
  const values = Object.values(progress);

  $("csvCount").textContent =
    csvVocabulary.length;

  $("practicedCount").textContent =
    vocabulary.filter(
      item => getProgress(item).seen > 0
    ).length;

  $("statSeen").textContent =
    values.reduce(
      (sum, p) => sum + (p.seen || 0),
      0
    );

  $("statCorrect").textContent =
    values.reduce(
      (sum, p) => sum + (p.correct || 0),
      0
    );

  $("statWrong").textContent =
    values.reduce(
      (sum, p) => sum + (p.wrong || 0),
      0
    );

  $("streak").textContent =
    calculateStreak();

  buildDifficultList();
}

/* =========================================
   LERNSERIE
========================================= */

function calculateStreak() {
  const dates = new Set(
    Object.values(progress)
      .filter(p => p.lastSeen)
      .map(
        p => new Date(p.lastSeen)
          .toLocaleDateString("de-DE")
      )
  );

  let d = new Date();
  let streak = 0;

  while (
    dates.has(
      d.toLocaleDateString("de-DE")
    )
  ) {
    streak++;

    d.setDate(
      d.getDate() - 1
    );
  }

  return streak;
}

/* =========================================
   SCHWIERIGE WÖRTER
========================================= */

function buildDifficultList() {
  const items = vocabulary
    .map(item => ({
      item,
      p: getProgress(item)
    }))
    .filter(x =>
      x.p.difficulty === "hard" ||
      difficultWords.includes(key(x.item))
    )
    .sort(
      (a, b) =>
        (b.p.wrong || 0) -
        (a.p.wrong || 0)
    )
    .slice(0, 10);

  $("difficultList").innerHTML =
    items.length
      ? items.map(x => `
          <div class="list-row">
            <b>
              ${escapeHtml(x.item.English.toLowerCase())}
            </b>
            <span>
              ${difficultyText(x.p.difficulty)}
            </span>
          </div>
        `).join("")
      : `
          <div class="detail">
            Noch keine schwierigen Wörter.
          </div>
        `;
}

/* =========================================
   CSV EXPORT
========================================= */

function csvEscape(value) {
  const text = String(value || "");

  if (/[",\n;]/.test(text)) {
    return '"' +
      text.replace(/"/g, '""') +
      '"';
  }

  return text;
}

function exportCSV() {
  const rows = [
    [
      "English",
      "Verb + preposition/construction",
      "Noun",
      "Adjective/Participle",
      "Adverb",
      "Deutsch",
      "Example sentence"
    ]
  ];

  vocabulary.forEach(item => {
    rows.push([
      item.English,
      item["Verb + preposition/construction"],
      item.Noun,
      item["Adjective/Participle"],
      item.Adverb,
      item.Deutsch,
      item.Example
    ]);
  });

  const csv = "\uFEFF" +
    rows
      .map(
        row => row.map(csvEscape).join(",")
      )
      .join("\r\n");

  const blob = new Blob(
    [csv],
    {
      type: "text/csv;charset=utf-8"
    }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "vocabulary.csv";
  a.click();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
}

/* =========================================
   EIGENE VOKABELN LÖSCHEN
========================================= */

function deleteLocalVocabulary() {
  if (!localVocabulary.length) {
    alert(
      "Keine eigenen Vokabeln vorhanden."
    );
    return;
  }

  if (
    !confirm(
      "Alle selbst hinzugefügten Vokabeln löschen?"
    )
  ) {
    return;
  }

  localVocabulary = [];

  localStorage.removeItem(
    "localVocabulary"
  );

  mergeVocabulary();
  createLearningRound();

  currentIndex = 0;
  history = [];

  updateStats();
  nextWord(true);
}

/* =========================================
   START
========================================= */

function start() {
  loadVocabulary();

  document.addEventListener(
    "gesturestart",
    e => e.preventDefault(),
    { passive: false }
  );

  document.addEventListener(
    "dblclick",
    e => e.preventDefault(),
    { passive: false }
  );
}

start();
