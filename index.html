<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Global HR Vocabulary</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 12px;
      font-size: 30px;
    }

    .top-stats {
      text-align: center;
      font-size: 15px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .top-stats strong {
      color: #222;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 25px;
      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .direction {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .difficulty {
      text-align: center;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 600;
    }

    .difficulty-new {
      color: #777;
    }

    .difficulty-easy {
      color: #2e7d32;
    }

    .difficulty-medium {
      color: #ef8c00;
    }

    .difficulty-hard {
      color: #d32f2f;
    }

    .word-area {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .word-box {
      min-width: 0;
      text-align: center;
    }

    .word {
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .word-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .speaker-button {
      border: none;
      background: #f0f0f2;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .speaker-button:active {
      transform: scale(0.94);
    }

    .connector {
      width: 55px;
      height: 2px;
      background: #ddd;
      position: relative;
      flex-shrink: 0;
    }

    .connector::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: #bbb;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .answer-hidden {
      visibility: hidden;
    }

    .show-button {
      min-width: 145px;
      min-height: 58px;
      padding: 14px 22px;
      border: none;
      border-radius: 16px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .show-button:active {
      transform: scale(0.97);
    }

    .example-area {
      width: 100%;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .example-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 7px;
      letter-spacing: 0.4px;
    }

    .example-content {
      font-size: 18px;
      line-height: 1.5;
      width: 100%;
    }

    .example-speaker {
      margin-left: 6px;
      vertical-align: middle;
    }

    .details {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      color: #666;
      line-height: 1.6;
      font-size: 15px;
    }

    .details div {
      margin-bottom: 4px;
    }

    /*
     * HANDSCHRIFT
     */

    .handwriting-area {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .handwriting-title {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
    }

    .canvas-wrapper {
      width: 100%;
      background: #fafafa;
      border: 2px solid #ddd;
      border-radius: 15px;
      overflow: hidden;
      touch-action: none;
    }

    #handwritingCanvas {
      display: block;
      width: 100%;
      height: 180px;
      touch-action: none;
      cursor: crosshair;
    }

    .writing-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .writing-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #eee;
      font-size: 15px;
      cursor: pointer;
    }

    .writing-buttons button.primary {
      background: #222;
      color: white;
    }

    .writing-feedback {
      text-align: center;
      margin-top: 10px;
      min-height: 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-area {
      display: none;
    }

    .result {
      text-align: center;
      margin-top: 12px;
      min-height: 24px;
      font-weight: 600;
    }

    .correct {
      color: #2e7d32;
    }

    .wrong {
      color: #d32f2f;
    }

    .navigation {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .navigation button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #eee;
      font-size: 16px;
      cursor: pointer;
    }

    .navigation button:last-child {
      background: #222;
      color: white;
    }

    .secondary-section {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 5px 20px rgba(0,0,0,0.05);
    }

    .secondary-section h2 {
      font-size: 19px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .secondary-section input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .secondary-section button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #eee;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .secondary-section button.primary {
      background: #222;
      color: white;
    }

    .secondary-section button.danger {
      background: #f7e8e8;
      color: #b3261e;
    }

    .translation-status {
      font-size: 14px;
      color: #777;
      min-height: 22px;
      margin-bottom: 8px;
    }

    .mode-buttons {
      display: flex;
      gap: 8px;
    }

    .mode-buttons button {
      flex: 1;
      margin-bottom: 0;
    }

    .mode-buttons button.active {
      background: #222;
      color: white;
    }

    .learning-info {
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .difficult-list {
      margin-top: 10px;
    }

    .difficult-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .difficult-item:last-child {
      border-bottom: none;
    }

    .difficult-word {
      font-weight: 600;
    }

    .difficult-score {
      font-size: 13px;
      color: #d32f2f;
      white-space: nowrap;
    }

    .empty-message {
      color: #888;
      font-size: 14px;
    }

    .small-button {
      width: auto !important;
      padding: 8px 12px !important;
      margin: 0 !important;
      background: #f0f0f2 !important;
      color: #222 !important;
      font-size: 13px !important;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 18px;
        border-radius: 18px;
      }

      .word-area {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .connector {
        width: 2px;
        height: 28px;
        margin: 0 auto;
      }

      .show-button {
        width: 100%;
      }

      .word {
        font-size: 31px;
      }

      .example-content {
        font-size: 17px;
      }

      #handwritingCanvas {
        height: 190px;
      }
    }

  </style>
</head>


<body>

<div class="container">

  <h1>Global HR Vocabulary</h1>

  <div class="top-stats">

    <div>
      <strong>CSV-Einträge:</strong>
      <span id="csvCount">0</span>
    </div>

    <div>
      <strong>Geübt:</strong>
      <span id="practicedCount">0</span>
      Wörter
    </div>

  </div>


  <div
    id="loading"
    class="loading"
  >
    Vokabeln werden geladen …
  </div>


  <div
    id="app"
    class="hidden"
  >


    <!-- LERNMODUS -->

    <div class="secondary-section">

      <h2>Lernmodus</h2>

      <div class="mode-buttons">

        <button
          id="learningModeButton"
          class="active"
          onclick="setMode('learning')"
        >
          🧠 LERNEN
        </button>

        <button
          id="testModeButton"
          onclick="setMode('test')"
        >
          🎯 TESTEN
        </button>

      </div>

    </div>


    <!-- HAUPTKARTE -->

    <div class="card">

      <div
        id="direction"
        class="direction"
      >
      </div>


      <div
        id="difficulty"
        class="difficulty difficulty-new"
      >
        ⚪ Neu
      </div>


      <div class="word-area">


        <div class="word-box">

          <div class="word-row">

            <div
              id="questionWord"
              class="word"
            >
            </div>

            <button
              class="speaker-button"
              onclick="speakEnglish()"
              title="Englisch anhören"
            >
              🔊
            </button>

          </div>

        </div>


        <div class="connector"></div>


        <div class="word-box">

          <div
            id="answerWord"
            class="word answer-hidden"
          >
          </div>

          <div
            id="answerSpeakerArea"
            class="answer-hidden"
          >

            <button
              class="speaker-button"
              onclick="speakEnglish()"
              title="Englisch anhören"
            >
              🔊
            </button>

          </div>

        </div>


        <button
          id="showButton"
          class="show-button"
          onclick="showAnswerAndNext()"
        >
          ANZEIGEN
        </button>

      </div>


      <!-- BEISPIELSATZ -->

      <div
        id="exampleArea"
        class="example-area answer-hidden"
      >

        <div class="example-label">
          Beispielsatz
        </div>

        <div
          id="exampleContent"
          class="example-content"
        >
        </div>

      </div>


      <!-- DETAILS -->

      <div
        id="answerDetails"
        class="details answer-hidden"
      >
      </div>


      <!-- HANDSCHRIFT -->

      <div class="handwriting-area">

        <div class="handwriting-title">

          ✍️ Schreibe das Wort mit deinem Finger

        </div>


        <div class="canvas-wrapper">

          <canvas
            id="handwritingCanvas"
          ></canvas>

        </div>


        <div class="writing-buttons">

          <button
            onclick="clearCanvas()"
          >
            LÖSCHEN
          </button>

          <button
            class="primary"
            onclick="checkHandwriting()"
          >
            FERTIG
          </button>

        </div>


        <div
          id="writingFeedback"
          class="writing-feedback"
        >
        </div>

      </div>


      <!-- ALTE TASTATUR-EINGABE IST ENTFERNT -->

      <div
        id="result"
        class="result"
      >
      </div>


      <!-- NAVIGATION -->

      <div class="navigation">

        <button
          onclick="previousWord()"
        >
          ← ZURÜCK
        </button>

        <button
          id="nextButton"
          onclick="nextWord()"
        >
          WEITER →
        </button>

      </div>

    </div>


    <!-- SCHWIERIGE WÖRTER -->

    <div class="secondary-section">

      <h2>⭐ Schwierige Wörter</h2>

      <div
        id="difficultList"
        class="difficult-list"
      >
      </div>

    </div>


    <!-- LERNFORTSCHRITT -->

    <div class="secondary-section">

      <h2>📊 Lernfortschritt</h2>

      <div
        id="learningStats"
        class="learning-info"
      >
      </div>

    </div>


    <!-- VOKABEL HINZUFÜGEN -->

    <div class="secondary-section">

      <h2>+ VOKABEL HINZUFÜGEN</h2>

      <input
        id="newEnglish"
        type="text"
        placeholder="Englisch"
      >

      <input
        id="newGerman"
        type="text"
        placeholder="Deutsch"
      >

      <button
        onclick="findTranslation()"
      >
        🔍 ÜBERSETZUNG SUCHEN
      </button>

      <div
        id="translationStatus"
        class="translation-status"
      >
      </div>

      <button
        class="primary"
        onclick="addVocabulary()"
      >
        VOKABEL SPEICHERN
      </button>

    </div>


    <!-- DATEN -->

    <div class="secondary-section">

      <h2>💾 Daten</h2>

      <button
        onclick="exportCSV()"
      >
        CSV EXPORTIEREN
      </button>

      <button
        class="danger"
        onclick="deleteLocalVocabulary()"
      >
        LOKALE VOKABELN LÖSCHEN
      </button>

    </div>


  </div>

</div>


<script>

  let csvVocabulary = [];
  let localVocabulary = [];
  let vocabulary = [];

  let currentIndex = 0;
  let history = [];

  let currentItem = null;
  let currentDirection = null;

  let currentMode = "learning";

  let speechTimeout = null;

  const STORAGE_KEY =
    "globalHrVocabularyLocal";

  const PROGRESS_KEY =
    "globalHrVocabularyProgress";


  /*
   * ================================================
   * INITIALISIERUNG
   * ================================================
   */

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      loadLocalVocabulary();

      loadVocabulary();

      updatePracticedCount();

      updateLearningStats();

      updateDifficultList();

      setupCanvas();

    }
  );


  /*
   * ================================================
   * LOCAL STORAGE
   * ================================================
   */

  function loadLocalVocabulary() {

    try {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      localVocabulary =
        saved
          ? JSON.parse(saved)
          : [];

    } catch (error) {

      console.error(error);

      localVocabulary = [];

    }

  }


  function saveLocalVocabulary() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        localVocabulary
      )
    );

  }


  /*
   * ================================================
   * FORTSCHRITT
   * ================================================
   */

  function loadProgress() {

    try {

      const saved =
        localStorage.getItem(
          PROGRESS_KEY
        );

      return saved
        ? JSON.parse(saved)
        : {};

    } catch (error) {

      return {};

    }

  }


  function saveProgress(progress) {

    localStorage.setItem(
      PROGRESS_KEY,
      JSON.stringify(
        progress
      )
    );

  }


  function getProgressKey(item) {

    return normalize(
      item.english
    );

  }


  function getWordProgress(item) {

    const progress =
      loadProgress();

    const key =
      getProgressKey(item);

    return progress[key] || {

      seen: 0,
      correct: 0,
      wrong: 0,
      revealed: 0,
      lastSeen: null

    };

  }


  function markAsPracticed() {

    if (!currentItem) {
      return;
    }

    const progress =
      loadProgress();

    const key =
      getProgressKey(
        currentItem
      );


    if (!progress[key]) {

      progress[key] = {

        seen: 0,
        correct: 0,
        wrong: 0,
        revealed: 0,
        lastSeen: null

      };

    }


    /*
     * Nur einmal pro Anzeige.
     */

    if (
      currentItem._counted
    ) {

      return;

    }

    currentItem._counted =
      true;


    progress[key].seen += 1;

    progress[key].revealed += 1;

    progress[key].lastSeen =
      Date.now();


    saveProgress(
      progress
    );


    updatePracticedCount();

    updateLearningStats();

    updateDifficultList();

  }


  function markCorrect() {

    if (!currentItem) {
      return;
    }

    const progress =
      loadProgress();

    const key =
      getProgressKey(
        currentItem
      );


    if (!progress[key]) {

      progress[key] = {

        seen: 0,
        correct: 0,
        wrong: 0,
        revealed: 0,
        lastSeen: null

      };

    }


    progress[key].seen += 1;

    progress[key].correct += 1;

    progress[key].revealed += 1;

    progress[key].lastSeen =
      Date.now();


    currentItem._counted =
      true;


    saveProgress(
      progress
    );


    updatePracticedCount();

    updateLearningStats();

    updateDifficultList();

  }


  function markWrong() {

    if (!currentItem) {
      return;
    }

    const progress =
      loadProgress();

    const key =
      getProgressKey(
        currentItem
      );


    if (!progress[key]) {

      progress[key] = {

        seen: 0,
        correct: 0,
        wrong: 0,
        revealed: 0,
        lastSeen: null

      };

    }


    progress[key].seen += 1;

    progress[key].wrong += 1;

    progress[key].revealed += 1;

    progress[key].lastSeen =
      Date.now();


    currentItem._counted =
      true;


    saveProgress(
      progress
    );


    updatePracticedCount();

    updateLearningStats();

    updateDifficultList();

  }


  function getDifficulty(item) {

    const p =
      getWordProgress(
        item
      );


    if (
      p.wrong >= 3 &&
      p.wrong > p.correct
    ) {

      return "hard";

    }


    if (
      p.seen >= 2 &&
      p.correct > p.wrong
    ) {

      return "easy";

    }


    if (
      p.seen > 0
    ) {

      return "medium";

    }


    return "new";

  }


  function getDifficultyLabel(item) {

    const difficulty =
      getDifficulty(
        item
      );


    if (
      difficulty === "hard"
    ) {

      return "🔴 Schwierig";

    }


    if (
      difficulty === "medium"
    ) {

      return "🟡 In Wiederholung";

    }


    if (
      difficulty === "easy"
    ) {

      return "🟢 Sicher";

    }


    return "⚪ Neu";

  }


  function updateDifficultyDisplay() {

    const element =
      document.getElementById(
        "difficulty"
      );


    const difficulty =
      getDifficulty(
        currentItem
      );


    element.className =
      "difficulty difficulty-" +
      difficulty;


    element.textContent =
      getDifficultyLabel(
        currentItem
      );

  }


  /*
   * ================================================
   * CSV LADEN
   * ================================================
   */

  async function loadVocabulary() {

    try {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => controller.abort(),
          10000
        );


      const url =
        new URL(
          "vocabulary.csv",
          window.location.href
        ).href +
        "?v=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            signal:
              controller.signal
          }
        );


      clearTimeout(
        timeout
      );


      if (
        !response.ok
      ) {

        throw new Error(
          "CSV konnte nicht geladen werden."
        );

      }


      const text =
        await response.text();


      csvVocabulary =
        parseCSV(
          text
        );


      document.getElementById(
        "csvCount"
      ).textContent =
        csvVocabulary.length;


      vocabulary =
        mergeVocabulary(
          csvVocabulary,
          localVocabulary
        );


      if (
        vocabulary.length === 0
      ) {

        throw new Error(
          "Keine Vokabeln gefunden."
        );

      }


      document.getElementById(
        "loading"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "app"
      ).classList.remove(
        "hidden"
      );


      currentIndex =
        Math.floor(
          Math.random() *
          vocabulary.length
        );


      displayCurrentWord();


      updateLearningStats();

      updateDifficultList();


    } catch (error) {

      console.error(
        error
      );


      document.getElementById(
        "loading"
      ).textContent =
        "Fehler beim Laden der vocabulary.csv";

    }

  }


  /*
   * ================================================
   * CSV PARSER
   * ================================================
   */

  function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      const char =
        text[i];

      const next =
        text[i + 1];


      if (
        char === '"' &&
        insideQuotes &&
        next === '"'
      ) {

        cell += '"';

        i++;

      }

      else if (
        char === '"'
      ) {

        insideQuotes =
          !insideQuotes;

      }

      else if (
        char === "," &&
        !insideQuotes
      ) {

        row.push(
          cell
        );

        cell = "";

      }

      else if (
        (
          char === "\n" ||
          char === "\r"
        ) &&
        !insideQuotes
      ) {

        if (
          char === "\r" &&
          next === "\n"
        ) {

          i++;

        }


        row.push(
          cell
        );

        cell = "";


        if (
          row.some(
            value =>
              value.trim() !== ""
          )
        ) {

          rows.push(
            row
          );

        }


        row = [];

      }

      else {

        cell += char;

      }

    }


    if (
      cell !== "" ||
      row.length > 0
    ) {

      row.push(
        cell
      );


      if (
        row.some(
          value =>
            value.trim() !== ""
        )
      ) {

        rows.push(
          row
        );

      }

    }


    if (
      rows.length < 2
    ) {

      return [];

    }


    const headers =
      rows[0].map(
        header =>
          header
            .replace(
              /^\uFEFF/,
              ""
            )
            .trim()
            .toLowerCase()
      );


    function findHeader(
      names
    ) {

      for (
        const name of names
      ) {

        const index =
          headers.indexOf(
            name
          );


        if (
          index !== -1
        ) {

          return index;

        }

      }


      return -1;

    }


    const englishIndex =
      findHeader([
        "english"
      ]);


    const germanIndex =
      findHeader([
        "deutsch",
        "german"
      ]);


    const constructionIndex =
      findHeader([
        "verb + preposition/construction",
        "verb + preposition / construction",
        "verb + construction",
        "construction"
      ]);


    const nounIndex =
      findHeader([
        "noun",
        "nomen"
      ]);


    const adjectiveIndex =
      findHeader([
        "adjective/participle",
        "adjective / participle",
        "adjective",
        "adjektiv/partizip",
        "adjektiv"
      ]);


    const exampleIndex =
      findHeader([
        "example sentence",
        "example sentences",
        "example",
        "examples",
        "beispielsatz",
        "beispielsätze",
        "beispiel",
        "beispiele"
      ]);


    const result = [];


    for (
      let i = 1;
      i < rows.length;
      i++
    ) {

      const row =
        rows[i];


      const english =
        englishIndex >= 0
          ? (
              row[
                englishIndex
              ] || ""
            ).trim()
          : "";


      const german =
        germanIndex >= 0
          ? (
              row[
                germanIndex
              ] || ""
            ).trim()
          : "";


      if (
        !english ||
        !german
      ) {

        continue;

      }


      result.push({

        english,

        german,

        construction:
          constructionIndex >= 0
            ? (
                row[
                  constructionIndex
                ] || ""
              ).trim()
            : "",

        noun:
          nounIndex >= 0
            ? (
                row[
                  nounIndex
                ] || ""
              ).trim()
            : "",

        adjective:
          adjectiveIndex >= 0
            ? (
                row[
                  adjectiveIndex
                ] || ""
              ).trim()
            : "",

        example:
          exampleIndex >= 0
            ? (
                row[
                  exampleIndex
                ] || ""
              ).trim()
            : ""

      });

    }


    return result;

  }


  /*
   * ================================================
   * MERGEN
   * ================================================
   */

  function mergeVocabulary(
    csvItems,
    localItems
  ) {

    const result = [];

    const keys =
      new Set();


    [
      ...csvItems,
      ...localItems
    ].forEach(
      item => {

        const key =
          normalize(
            item.english
          ) +
          "|" +
          normalize(
            item.german
          );


        if (
          !keys.has(key)
        ) {

          keys.add(key);

          result.push(
            item
          );

        }

      }
    );


    return result;

  }

  /*

   */

  let canvas = null;
  let ctx = null;

  let drawing = false;

  let hasWritten = false;


  function setupCanvas() {

    canvas =
      document.getElementById(
        "handwritingCanvas"
      );


    if (!canvas) {
      return;
    }


    ctx =
      canvas.getContext(
        "2d"
      );


    resizeCanvas();


    canvas.addEventListener(
      "pointerdown",
      startDrawing
    );


    canvas.addEventListener(
      "pointermove",
      draw
    );


    canvas.addEventListener(
      "pointerup",
      stopDrawing
    );


    canvas.addEventListener(
      "pointercancel",
      stopDrawing
    );


    canvas.addEventListener(
      "pointerleave",
      stopDrawing
    );


    window.addEventListener(
      "resize",
      resizeCanvas
    );

  }


  function resizeCanvas() {

    if (!canvas) {
      return;
    }


    const rect =
      canvas.getBoundingClientRect();


    const ratio =
      window.devicePixelRatio ||
      1;


    const oldImage =
      canvas.width > 0
        ? canvas.toDataURL()
        : null;


    canvas.width =
      rect.width *
      ratio;


    canvas.height =
      rect.height *
      ratio;


    ctx =
      canvas.getContext(
        "2d"
      );


    ctx.scale(
      ratio,
      ratio
    );


    ctx.lineWidth =
      3;


    ctx.lineCap =
      "round";


    ctx.lineJoin =
      "round";


    ctx.strokeStyle =
      "#222";


    /*
     * Nach einer Größenänderung
     * wird die Fläche bewusst geleert.
     */

    hasWritten =
      false;

  }


  function getCanvasPosition(
    event
  ) {

    const rect =
      canvas.getBoundingClientRect();


    return {

      x:
        event.clientX -
        rect.left,

      y:
        event.clientY -
        rect.top

    };

  }


  function startDrawing(
    event
  ) {

    event.preventDefault();


    drawing =
      true;


    hasWritten =
      true;


    const position =
      getCanvasPosition(
        event
      );


    ctx.beginPath();


    ctx.moveTo(
      position.x,
      position.y
    );


    canvas.setPointerCapture(
      event.pointerId
    );

  }


  function draw(
    event
  ) {

    if (!drawing) {
      return;
    }


    event.preventDefault();


    const position =
      getCanvasPosition(
        event
      );


    ctx.lineTo(
      position.x,
      position.y
    );


    ctx.stroke();

  }


  function stopDrawing(
    event
  ) {

    if (!drawing) {
      return;
    }


    drawing =
      false;


    ctx.closePath();

  }


  function clearCanvas() {

    if (!canvas || !ctx) {
      return;
    }


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    hasWritten =
      false;


    document.getElementById(
      "writingFeedback"
    ).textContent =
      "";

  }

  function nextWord() {

    clearSpeech();

    history.push(
      currentIndex
    );


    currentIndex =
      chooseNextIndex();


    displayCurrentWord();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function chooseNextIndex() {

    if (
      vocabulary.length <= 1
    ) {

      return 0;

    }


    const weighted = [];


    vocabulary.forEach(
      (
        item,
        index
      ) => {

        if (
          index === currentIndex
        ) {

          return;

        }


        const difficulty =
          getDifficulty(
            item
          );


        let weight = 1;


        if (
          difficulty === "hard"
        ) {

          weight = 6;

        }

        else if (
          difficulty === "medium"
        ) {

          weight = 3;

        }

        else if (
          difficulty === "new"
        ) {

          weight = 2;

        }


        for (
          let i = 0;
          i < weight;
          i++
        ) {

          weighted.push(
            index
          );

        }

      }
    );


    return weighted[
      Math.floor(
        Math.random() *
        weighted.length
      )
    ];

  }


  function previousWord() {

    clearSpeech();


    if (
      history.length === 0
    ) {

      return;

    }


    currentIndex =
      history.pop();


    displayCurrentWord();

  }

    const difficult =

        .map(

              )

        )
        .filter(

            entry.progress.wrong > 0
        )
        .sort(
          (
            a,
            b
          ) =>
            b.progress.wrong -

        )
        .slice(
          0,
          10
        );


    if (
      difficult.length === 0
    ) {

      container.innerHTML =
        `
          <div class="empty-message">

      return;

    container.innerHTML =
      difficult
        .map(

            const item =
              entry.item;

            return `

  async function findTranslation() {

    const english =
      document.getElementById(
        "newEnglish"
      ).value.trim();


    const german =
      document.getElementById(
        "newGerman"
      ).value.trim();


    const status =
      document.getElementById(
        "translationStatus"
      );


    let source = "";
    let sourceLanguage = "";
    let targetLanguage = "";


    if (
      english
    ) {

      source =
        english;

      sourceLanguage =
        "en";

      targetLanguage =
        "de";

    }

    else if (
      german
    ) {

      source =
        german;

      sourceLanguage =
        "de";

      targetLanguage =
        "en";

    }

    else {

      status.textContent =
        "Bitte zuerst ein Wort eingeben.";

      return;

    }


    status.textContent =
      "Übersetzung wird gesucht …";


    try {

      const url =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(
          source
        ) +
        "&langpair=" +
        sourceLanguage +
        "|" +
        targetLanguage;


      const response =
        await fetch(
          url
        );


      const data =
        await response.json();


      const translation =
        data?.responseData?.translatedText;


      if (
        !translation
      ) {

        throw new Error(
          "Keine Übersetzung gefunden."
        );

      }


      if (
        sourceLanguage === "en"
      ) {

        document.getElementById(
          "newGerman"
        ).value =
          translation;

      } else {

        document.getElementById(
          "newEnglish"
        ).value =
          translation;

      }


      status.textContent =
        "✓ Übersetzung gefunden.";

    }

    catch (error) {

      console.error(
        error
      );


      status.textContent =
        "Übersetzung konnte nicht gefunden werden.";

    }

  }


  function addVocabulary() {

    const english =
      document.getElementById(
        "newEnglish"
      ).value.trim();


    const german =
      document.getElementById(
        "newGerman"
      ).value.trim();


    const status =
      document.getElementById(
        "translationStatus"
      );


    if (
      !english ||
      !german
    ) {

      status.textContent =
        "Bitte Englisch und Deutsch eingeben.";

      return;

    }


    const duplicate =
      vocabulary.some(
        item =>
          normalize(
            item.english
          ) ===
          normalize(
            english
          ) &&
          normalize(
            item.german
          ) ===
          normalize(
            german
          )
      );


    if (
      duplicate
    ) {

      status.textContent =
        "Diese Vokabel existiert bereits.";

      return;

    }


    const item = {

      english,

      german,

      construction: "",

      noun: "",

      adjective: "",

      example: ""

    };


    localVocabulary.push(
      item
    );


    saveLocalVocabulary();


    vocabulary =
      mergeVocabulary(
        csvVocabulary,
        localVocabulary
      );


    document.getElementById(
      "newEnglish"
    ).value = "";


    document.getElementById(
      "newGerman"
    ).value = "";


    status.textContent =
      "✓ Vokabel gespeichert.";


    document.getElementById(
      "csvCount"
    ).textContent =
      csvVocabulary.length;


    updateLearningStats();

    updateDifficultList();

  }

   */

  function exportCSV() {

    const header = [

      "English",

      "Verb + preposition/construction",

      "Noun",

      "Adjective/Participle",

      "Deutsch",

      "Example sentence"

    ];


    const rows =
      vocabulary.map(
        item => [

          item.english,

          item.construction || "",

          item.noun || "",

          item.adjective || "",

          item.german,

          item.example || ""

        ]
      );


    const csv = [

      header,

      ...rows

    ]
      .map(
        row =>
          row
            .map(
              value =>
                csvEscape(
                  value
                )
            )
            .join(",")
      )
      .join("\r\n");


    const blob =
      new Blob(
        [
          "\uFEFF" + csv
        ],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      "vocabulary.csv";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
      url
    );

  }


  function csvEscape(value) {

    const string =
      String(
        value ?? ""
      );


    if (
      string.includes(",") ||
      string.includes('"') ||
      string.includes("\n") ||
      string.includes("\r")
    ) {

      return (
        '"' +
        string.replace(
          /"/g,
          '""'
        ) +
        '"'
      );

    }


    return string;

  }


  /*
   * ================================================
   * LOKALE VOKABELN LÖSCHEN
   * ================================================
   */

  function deleteLocalVocabulary() {

    const confirmed =
      confirm(
        "Möchtest du wirklich alle lokal hinzugefügten Vokabeln löschen?"
      );


    if (
      !confirmed
    ) {

      return;

    }


    localVocabulary = [];


    saveLocalVocabulary();


    vocabulary =
      mergeVocabulary(
        csvVocabulary,
        localVocabulary
      );


    updateLearningStats();

    updateDifficultList();


    if (
      currentIndex >=
      vocabulary.length
    ) {

      currentIndex =
        0;

    }


    displayCurrentWord();

  }


  /*
   * ================================================
   * HILFSFUNKTIONEN
   * ================================================
   */

  function normalize(
    text
  ) {

    return String(
      text
    )
      .toLowerCase()
      .trim()
      .replace(
        /\s+/g,
        " "
      )
      .replace(
        /[.,!?;:]+$/g,
        ""
      );

  }


  function escapeHTML(
    value
  ) {

    return String(
      value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(
    value
  ) {

    return String(
      value
    )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );

  }


  /*

   * SPEECH VOICES
   * ================================================
   */

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis
      .onvoiceschanged =
      () => {

        window.speechSynthesis
          .getVoices();

      };

  }
