<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global HR Vocabulary</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 30px;
    }

    #question {
      font-size: 32px;
      font-weight: bold;
      margin: 50px 0 25px 0;
    }

    #answer {
      font-size: 26px;
      margin-bottom: 40px;
      min-height: 35px;
    }

    button {
      width: 100%;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      cursor: pointer;
      margin-top: 12px;
    }

    button:active {
      transform: scale(0.98);
    }

    #nextButton {
      display: none;
    }

    #status {
      color: #777;
      font-size: 14px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Global HR Vocabulary</h1>

  <div id="question">Vokabelliste wird geladen...</div>

  <div id="answer"></div>

  <button id="showButton" onclick="showAnswer()" style="display:none;">
    ANZEIGEN
  </button>

  <button id="nextButton" onclick="nextQuestion()">
    NÄCHSTE VOKABEL
  </button>

  <div id="status"></div>

</div>

<script>

  let vocabulary = [];
  let currentWord = null;
  let direction = null;

  async function loadVocabulary() {

    try {

      const response = await fetch("vocabulary.csv?t=" + Date.now());

      if (!response.ok) {
        throw new Error("Vokabelliste konnte nicht geladen werden.");
      }

      const text = await response.text();

      vocabulary = parseCSV(text);

      if (vocabulary.length === 0) {
        throw new Error("Keine Vokabeln gefunden.");
      }

      document.getElementById("status").textContent =
        vocabulary.length + " Vokabeln";

      nextQuestion();

    } catch (error) {

      document.getElementById("question").textContent =
        error.message;

    }

  }


  function parseCSV(text) {

    const lines = text
      .split(/\r?\n/)
      .filter(line => line.trim() !== "");

    const result = [];

    for (let i = 1; i < lines.length; i++) {

      const parts = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);

      if (!parts || parts.length < 2) {
        continue;
      }

      const english = parts[0]
        .replace(/^"|"$/g, "")
        .trim();

      const german = parts[1]
        .replace(/^"|"$/g, "")
        .trim();

      if (english && german) {

        result.push({
          english: english,
          german: german
        });

      }

    }

    return result;

  }


  function nextQuestion() {

    if (vocabulary.length === 0) {
      return;
    }

    currentWord =
      vocabulary[Math.floor(Math.random() * vocabulary.length)];

    direction =
      Math.random() < 0.5 ? "de-en" : "en-de";


    if (direction === "de-en") {

      document.getElementById("question").textContent =
        currentWord.german;

    } else {

      document.getElementById("question").textContent =
        currentWord.english;

    }


    document.getElementById("answer").textContent = "";

    document.getElementById("showButton").style.display =
      "block";

    document.getElementById("nextButton").style.display =
      "none";

  }


  function showAnswer() {

    if (!currentWord) {
      return;
    }


    if (direction === "de-en") {

      document.getElementById("answer").textContent =
        currentWord.english;

    } else {

      document.getElementById("answer").textContent =
        currentWord.german;

    }


    document.getElementById("showButton").style.display =
      "none";

    document.getElementById("nextButton").style.display =
      "block";

  }


  loadVocabulary();

</script>

</body>
</html>
