<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global HR Vocabulary</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
    }

    .container {
        max-width: 850px;
        margin: 0 auto;
        padding: 30px 20px 60px;
    }

    h1 {
        text-align: center;
        font-size: 30px;
        margin: 0 0 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .stats {
        text-align: center;
        font-size: 15px;
        color: #666;
        margin-bottom: 25px;
    }

    /* =========================
       VOCABULARY CARD
       ========================= */

    .vocab-card {
        background: white;
        border-radius: 24px;
        padding: 35px 35px 30px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    .language-label {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        color: #888;
        letter-spacing: 0.8px;
        margin-bottom: 10px;
    }

    .word {
        font-size: clamp(27px, 5vw, 44px);
        font-weight: 700;
        line-height: 1.15;
        word-break: break-word;
    }

    .word-area {
        min-height: 105px;
        display: flex;
        align-items: center;
    }

    .answer-area {
        min-height: 105px;
        display: flex;
        align-items: center;
    }

    .answer {
        font-size: clamp(24px, 4.5vw, 38px);
        font-weight: 600;
        line-height: 1.2;
        color: #333;
        word-break: break-word;
    }

    .hidden-answer {
        visibility: hidden;
    }

    /* Verbindung zwischen den beiden Wörtern */

    .connection {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 4px 0;
    }

    .connection-line {
        height: 2px;
        background: #d5d5d5;
        flex: 1;
    }

    .connection-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #999;
        flex-shrink: 0;
    }

    /* Button rechts */

    .show-button {
        flex: 0 0 145px;
        min-height: 70px;
        border: none;
        border-radius: 18px;
        background: #1d1d1f;
        color: white;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
    }

    .show-button:active {
        transform: scale(0.97);
    }

    .show-button:hover {
        opacity: 0.88;
    }

    /* =========================
       NAVIGATION
       ========================= */

    .navigation {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
    }

    .back-button {
        border: none;
        background: transparent;
        color: #555;
        font-size: 14px;
        cursor: pointer;
        padding: 8px 14px;
    }

    .back-button:hover {
        color: #000;
    }

    /* =========================
       OPTIONAL ANSWER INPUT
       ========================= */

    .input-section {
        background: white;
        border-radius: 20px;
        padding: 22px;
        margin-bottom: 20px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .input-section h2 {
        font-size: 17px;
        margin: 0 0 12px;
    }

    .answer-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #ccc;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
    }

    .answer-input:focus {
        border-color: #555;
    }

    .input-buttons {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
    }

    .secondary-button {
        border: none;
        background: #e9e9ed;
        color: #222;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .result {
        margin-top: 12px;
        font-weight: 600;
    }

    /* =========================
       ADD VOCABULARY
       ========================= */

    .section {
        background: white;
        border-radius: 20px;
        padding: 22px;
        margin-top: 20px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .section h2 {
        margin: 0 0 15px;
        font-size: 19px;
    }

    .field {
        margin-bottom: 12px;
    }

    .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #666;
        margin-bottom: 6px;
    }

    .field input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #ccc;
        border-radius: 11px;
        font-size: 16px;
    }

    .translation-button,
    .save-button {
        width: 100%;
        border: none;
        padding: 13px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 5px;
    }

    .translation-button {
        background: #e9e9ed;
        color: #222;
    }

    .save-button {
        background: #1d1d1f;
        color: white;
    }

    .translation-status {
        font-size: 14px;
        margin: 10px 0;
        min-height: 20px;
    }

    .danger-button {
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: #eee;
        color: #555;
        cursor: pointer;
    }

    .export-button {
        width: 100%;
        margin-top: 10px;
        padding: 13px;
        border: none;
        border-radius: 12px;
        background: #e9e9ed;
        color: #222;
        font-weight: 700;
        cursor: pointer;
    }

    .loading {
        text-align: center;
        color: #777;
        padding: 40px 0;
    }

    .error {
        background: #fff0f0;
        color: #a00000;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
        white-space: pre-wrap;
    }

    @media (max-width: 600px) {
        .container {
            padding: 20px 12px 40px;
        }

        .vocab-card {
            padding: 25px 20px;
        }

        .connection {
            gap: 10px;
        }

        .show-button {
            flex-basis: 115px;
            min-height: 65px;
            font-size: 15px;
        }

        .word-area,
        .answer-area {
            min-height: 90px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Global HR Vocabulary</h1>

    <div class="subtitle">
        English ↔ Deutsch
    </div>

    <div class="stats" id="stats">
        Geübt: 0 Wörter
    </div>

    <div id="loading" class="loading">
        Lade Vokabeln...
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <div id="app" style="display:none;">

        <!-- VOCABULARY -->
        <div class="vocab-card">

            <div class="word-area">
                <div>
                    <div class="language-label" id="questionLanguage">
                        Englisch
                    </div>

                    <div class="word" id="questionWord"></div>
                </div>
            </div>

            <div class="connection">

                <div class="connection-line"></div>

                <div class="connection-dot"></div>

                <button
                    class="show-button"
                    id="showButton"
                    onclick="showAnswerAndNext()">
                    ANZEIGEN
                </button>

            </div>

            <div class="answer-area">

                <div>
                    <div class="language-label" id="answerLanguage">
                        Deutsch
                    </div>

                    <div
                        class="answer hidden-answer"
                        id="answerWord">
                    </div>
                </div>

            </div>

        </div>

        <!-- BACK -->
        <div class="navigation">
            <button
                class="back-button"
                onclick="previousWord()">
                ← ZURÜCK
            </button>
        </div>

        <!-- OPTIONAL ANSWER -->
        <div class="input-section">

            <h2>✍️ Antwort eingeben</h2>

            <input
                type="text"
                id="answerInput"
                class="answer-input"
                placeholder="Optional – deine Antwort eingeben">

            <div class="input-buttons">

                <button
                    class="secondary-button"
                    onclick="checkAnswer()">
                    ANTWORT PRÜFEN
                </button>

                <button
                    class="secondary-button"
                    onclick="showAnswerOnly()">
                    ANTWORT ANZEIGEN
                </button>

            </div>

            <div
                id="answerResult"
                class="result">
            </div>

        </div>

        <!-- ADD VOCABULARY -->
        <div class="section">

            <h2>+ VOKABEL HINZUFÜGEN</h2>

            <div class="field">

                <label for="englishInput">
                    Englisch
                </label>

                <input
                    type="text"
                    id="englishInput"
                    placeholder="z. B. to arrange something">

            </div>

            <div class="field">

                <label for="germanInput">
                    Deutsch
                </label>

                <input
                    type="text"
                    id="germanInput"
                    placeholder="z. B. etwas organisieren">

            </div>

            <button
                class="translation-button"
                onclick="findTranslation()">
                🔍 ÜBERSETZUNG SUCHEN
            </button>

            <div
                id="translationStatus"
                class="translation-status">
            </div>

            <button
                class="save-button"
                onclick="saveVocabulary()">
                VOKABEL SPEICHERN
            </button>

            <button
                class="export-button"
                onclick="exportCSV()">
                ⬇️ VOKABELN ALS CSV EXPORTIEREN
            </button>

            <button
                class="danger-button"
                onclick="deleteLocalVocabulary()">
                LOKALE VOKABELN LÖSCHEN
            </button>

        </div>

    </div>

</div>

<script>

let vocabulary = [];
let history = [];
let currentIndex = -1;
let currentDirection = "en-de";

let practicedWords =
    JSON.parse(localStorage.getItem("practicedWords") || "[]");

let localVocabulary =
    JSON.parse(localStorage.getItem("localVocabulary") || "[]");


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeText(text) {

    return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/[.,!?;:]+$/g, "")
        .replace(/\s+/g, " ");

}


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSVLine(line) {

    const result = [];
    let current = "";
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {

        const char = line[i];

        if (char === '"') {

            if (
                insideQuotes &&
                line[i + 1] === '"'
            ) {
                current += '"';
                i++;
            } else {
                insideQuotes = !insideQuotes;
            }

        } else if (
            char === "," &&
            !insideQuotes
        ) {

            result.push(current);
            current = "";

        } else {

            current += char;

        }
    }

    result.push(current);

    return result;
}


/* =========================================================
   LOAD CSV
   ========================================================= */

async function loadVocabulary() {

    try {

        const csvUrl =
            new URL(
                "vocabulary.csv",
                window.location.href
            ).href +
            "?v=" +
            Date.now();

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                () => controller.abort(),
                10000
            );

        const response =
            await fetch(
                csvUrl,
                {
                    cache: "no-store",
                    signal: controller.signal
                }
            );

        clearTimeout(timeout);

        if (!response.ok) {

            throw new Error(
                "CSV konnte nicht geladen werden. HTTP-Status: " +
                response.status
            );

        }

        const text =
            await response.text();

        const lines =
            text
                .split(/\r?\n/)
                .filter(line => line.trim() !== "");

        if (lines.length < 2) {

            throw new Error(
                "Die vocabulary.csv enthält keine Vokabeln."
            );

        }

        const headers =
            parseCSVLine(lines[0])
                .map(h =>
                    normalizeText(h)
                );

        let englishIndex =
            headers.indexOf("english");

        let germanIndex =
            headers.indexOf("deutsch");

        if (englishIndex === -1)
            englishIndex = 0;

        if (germanIndex === -1)
            germanIndex = 4;

        const csvVocabulary = [];

        for (
            let i = 1;
            i < lines.length;
            i++
        ) {

            const columns =
                parseCSVLine(lines[i]);

            const english =
                (columns[englishIndex] || "").trim();

            const german =
                (columns[germanIndex] || "").trim();

            if (!english || !german)
                continue;

            csvVocabulary.push({
                english,
                german
            });

        }

        vocabulary = mergeVocabulary(
            csvVocabulary,
            localVocabulary
        );

        if (vocabulary.length === 0) {

            throw new Error(
                "Es wurden keine gültigen Vokabeln gefunden."
            );

        }

        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("app")
            .style.display = "block";

        updateStats();

        nextWord();

    } catch (error) {

        document.getElementById("loading")
            .style.display = "none";

        const errorBox =
            document.getElementById("errorBox");

        errorBox.style.display = "block";

        if (error.name === "AbortError") {

            errorBox.textContent =
                "Die vocabulary.csv konnte innerhalb von 10 Sekunden nicht geladen werden.";

        } else {

            errorBox.textContent =
                "Fehler beim Laden der Vokabeln:\n" +
                error.message;

        }

    }

}


/* =========================================================
   MERGE VOCABULARY
   ========================================================= */

function mergeVocabulary(base, local) {

    const result = [];
    const seen = new Set();

    [...base, ...local].forEach(item => {

        if (
            !item.english ||
            !item.german
        )
            return;

        const key =
            normalizeText(item.english) +
            "|" +
            normalizeText(item.german);

        if (seen.has(key))
            return;

        seen.add(key);

        result.push({
            english: item.english,
            german: item.german
        });

    });

    return result;
}


/* =========================================================
   NEXT WORD
   ========================================================= */

function nextWord() {

    if (vocabulary.length === 0)
        return;

    if (currentIndex >= 0) {

        history.push({
            index: currentIndex,
            direction: currentDirection
        });

    }

    let newIndex;

    do {

        newIndex =
            Math.floor(
                Math.random() *
                vocabulary.length
            );

    } while (
        vocabulary.length > 1 &&
        newIndex === currentIndex
    );

    currentIndex = newIndex;

    currentDirection =
        Math.random() < 0.5
            ? "en-de"
            : "de-en";

    displayCurrentWord();

}


/* =========================================================
   DISPLAY WORD
   ========================================================= */

function displayCurrentWord() {

    const item =
        vocabulary[currentIndex];

    const questionWord =
        document.getElementById(
            "questionWord"
        );

    const answerWord =
        document.getElementById(
            "answerWord"
        );

    const questionLanguage =
        document.getElementById(
            "questionLanguage"
        );

    const answerLanguage =
        document.getElementById(
            "answerLanguage"
        );

    const answerInput =
        document.getElementById(
            "answerInput"
        );

    const answerResult =
        document.getElementById(
            "answerResult"
        );

    if (currentDirection === "en-de") {

        questionLanguage.textContent =
            "Englisch";

        answerLanguage.textContent =
            "Deutsch";

        questionWord.textContent =
            item.english;

        answerWord.textContent =
            item.german;

    } else {

        questionLanguage.textContent =
            "Deutsch";

        answerLanguage.textContent =
            "Englisch";

        questionWord.textContent =
            item.german;

        answerWord.textContent =
            item.english;

    }

    answerWord.classList.add(
        "hidden-answer"
    );

    answerInput.value = "";

    answerResult.textContent = "";

    document.getElementById(
        "showButton"
    ).textContent = "ANZEIGEN";

}


/* =========================================================
   SHOW ANSWER + AUTOMATICALLY NEXT WORD
   ========================================================= */

function showAnswerAndNext() {

    const answerWord =
        document.getElementById(
            "answerWord"
        );

    const button =
        document.getElementById(
            "showButton"
        );

    /* Wenn Antwort noch nicht sichtbar ist:
       zuerst anzeigen */

    if (
        answerWord.classList.contains(
            "hidden-answer"
        )
    ) {

        answerWord.classList.remove(
            "hidden-answer"
        );

        button.textContent =
            "NÄCHSTE →";

        markAsPracticed();

        /*
         * Kurze Pause, damit die Übersetzung
         * tatsächlich sichtbar ist.
         */

        setTimeout(() => {

            nextWord();

        }, 900);

    } else {

        nextWord();

    }

}


/* =========================================================
   SHOW ANSWER ONLY
   ========================================================= */

function showAnswerOnly() {

    const answerWord =
        document.getElementById(
            "answerWord"
        );

    answerWord.classList.remove(
        "hidden-answer"
    );

    markAsPracticed();

}


/* =========================================================
   PREVIOUS WORD
   ========================================================= */

function previousWord() {

    if (history.length === 0)
        return;

    const previous =
        history.pop();

    currentIndex =
        previous.index;

    currentDirection =
        previous.direction;

    displayCurrentWord();

}


/* =========================================================
   PRACTICED
   ========================================================= */

function markAsPracticed() {

    const item =
        vocabulary[currentIndex];

    if (!item)
        return;

    const key =
        normalizeText(item.english) +
        "|" +
        normalizeText(item.german);

    if (!practicedWords.includes(key)) {

        practicedWords.push(key);

        localStorage.setItem(
            "practicedWords",
            JSON.stringify(practicedWords)
        );

    }

    updateStats();

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

    document.getElementById(
        "stats"
    ).textContent =
        "Geübt: " +
        practicedWords.length +
        " Wörter";

}


/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer() {

    const input =
        document.getElementById(
            "answerInput"
        );

    const result =
        document.getElementById(
            "answerResult"
        );

    const answer =
        normalizeText(input.value);

    if (!answer) {

        result.textContent =
            "Bitte zuerst eine Antwort eingeben.";

        return;

    }

    const item =
        vocabulary[currentIndex];

    const correctAnswer =
        currentDirection === "en-de"
            ? item.german
            : item.english;

    const acceptedAnswers =
        correctAnswer
            .split("/")
            .map(a =>
                normalizeText(a)
            );

    if (
        acceptedAnswers.includes(answer)
    ) {

        result.textContent =
            "✓ Richtig!";

        markAsPracticed();

    } else {

        result.textContent =
            "✗ Nicht ganz – richtige Antwort: " +
            correctAnswer;

        markAsPracticed();

    }

}


/* =========================================================
   INPUT LISTENERS
   ========================================================= */

function setupTranslationInputs() {

    const englishInput =
        document.getElementById(
            "englishInput"
        );

    const germanInput =
        document.getElementById(
            "germanInput"
        );

    englishInput.addEventListener(
        "input",
        function() {

            if (this.value.trim() !== "") {

                germanInput.value = "";

            }

        }
    );

    germanInput.addEventListener(
        "input",
        function() {

            if (this.value.trim() !== "") {

                englishInput.value = "";

            }

        }
    );

}


/* =========================================================
   TRANSLATION
   ========================================================= */

async function findTranslation() {

    const englishInput =
        document.getElementById(
            "englishInput"
        );

    const germanInput =
        document.getElementById(
            "germanInput"
        );

    const status =
        document.getElementById(
            "translationStatus"
        );

    const english =
        englishInput.value.trim();

    const german =
        germanInput.value.trim();

    if (!english && !german) {

        status.textContent =
            "Bitte Englisch oder Deutsch eingeben.";

        return;

    }

    if (english && german) {

        status.textContent =
            "Bitte nur Englisch oder Deutsch eingeben.";

        return;

    }

    status.textContent =
        "Übersetzung wird gesucht...";

    try {

        let query;
        let langpair;

        if (english) {

            query = english;
            langpair = "en|de";

        } else {

            query = german;
            langpair = "de|en";

        }

        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(query) +
            "&langpair=" +
            langpair;

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Übersetzungsdienst nicht erreichbar."
            );

        }

        const data =
            await response.json();

        if (
            !data.responseData ||
            !data.responseData.translatedText
        ) {

            throw new Error(
                "Keine Übersetzung gefunden."
            );

        }

        const translation =
            data.responseData.translatedText.trim();

        if (english) {

            germanInput.value =
                translation;

        } else {

            englishInput.value =
                translation;

        }

        status.textContent =
            "✓ Übersetzung gefunden.";

    } catch (error) {

        status.textContent =
            "Übersetzung konnte nicht gefunden werden.";

    }

}


/* =========================================================
   SAVE VOCABULARY
   ========================================================= */

function saveVocabulary() {

    const englishInput =
        document.getElementById(
            "englishInput"
        );

    const germanInput =
        document.getElementById(
            "germanInput"
        );

    const status =
        document.getElementById(
            "translationStatus"
        );

    const english =
        englishInput.value.trim();

    const german =
        germanInput.value.trim();

    if (!english || !german) {

        status.textContent =
            "Bitte Englisch und Deutsch ausfüllen.";

        return;

    }

    const exists =
        vocabulary.some(item =>
            normalizeText(item.english) ===
            normalizeText(english) &&
            normalizeText(item.german) ===
            normalizeText(german)
        );

    if (exists) {

        status.textContent =
            "Diese Vokabel ist bereits vorhanden.";

        return;

    }

    const newWord = {
        english,
        german
    };

    localVocabulary.push(
        newWord
    );

    localStorage.setItem(
        "localVocabulary",
        JSON.stringify(localVocabulary)
    );

    vocabulary.push(
        newWord
    );

    englishInput.value = "";
    germanInput.value = "";

    status.textContent =
        "✓ Vokabel gespeichert.";

}


/* =========================================================
   DELETE LOCAL VOCABULARY
   ========================================================= */

function deleteLocalVocabulary() {

    if (
        !confirm(
            "Möchtest du alle lokal hinzugefügten Vokabeln löschen?"
        )
    ) {
        return;
    }

    localStorage.removeItem(
        "localVocabulary"
    );

    localVocabulary = [];

    /*
     * CSV-Vokabeln neu laden,
     * lokale Vokabeln verschwinden.
     */

    loadVocabulary();

}


/* =========================================================
   CSV EXPORT
   ========================================================= */

function csvEscape(value) {

    value = String(value || "");

    return '"' +
        value.replace(/"/g, '""') +
        '"';

}


function exportCSV() {

    const rows = [];

    rows.push(
        [
            "English",
            "Verb + preposition/construction",
            "Noun",
            "Adjective/Participle",
            "Deutsch"
        ].join(",")
    );

    vocabulary.forEach(item => {

        rows.push(
            [
                csvEscape(item.english),
                "",
                "",
                "",
                csvEscape(item.german)
            ].join(",")
        );

    });

    const csv =
        "\uFEFF" +
        rows.join("\r\n");

    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "vocabulary.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}
